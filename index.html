    { code:'B', desc:'Terremoto, Maremoto, Erupción Volcánica', sum:+(cv.B&&cv.B.sum)||0 },
    { code:'C', desc:'Ciclón, Huracán, Inundación, Deslizamiento', sum:+(cv.C&&cv.C.sum)||0 },
    { code:'D', desc:'Daños durante Mantenimiento', sum:+(cv.D&&cv.D.sum)||0 },
    { code:'E + F', desc:'Responsabilidad Civil Extracontractual a Terceros (por evento)', sum:+(cv.EF&&cv.EF.sum_event)||0 },
    { code:'G', desc:'Remoción de Escombros ('+(g.pct||10)+'% del siniestro, tope máx.)', sum:+g.max||0 }
  ];
}
function siTotal(c){
  return (+c.sums.works||0)+(+c.sums.supplies||0)+(+c.sums.cpm||0)+(+c.sums.temp||0)+(+c.sums.debris||0)+(+c.sums.fees||0)+(+c.sums.extra||0);
}
/* helpers de actualización */
function updField(k, v){ const c=activeCase(); if(!c)return; c[k]=v; c.updatedAt=new Date().toISOString(); save(); syncTwinInputs(k, v); if(k==='status') render(); }
function updPath(path, v){
  const c=activeCase(); if(!c)return;
  const parts = path.split('.');
  let obj=c; for(let i=0;i<parts.length-1;i++) obj=obj[parts[i]];
  obj[parts[parts.length-1]] = v;
  c.updatedAt=new Date().toISOString(); save();
  syncTwinInputs(path, v);
}
/* Modo Rápido <-> Avanzado: cuando un dato cambia, actualiza en pantalla
   todos los campos que muestran ese mismo dato (sin redibujar la página). */
function syncTwinInputs(path, v){
  const key = "('" + path + "'";
  document.querySelectorAll('input,select,textarea').forEach(el => {
    const oc = el.getAttribute('onchange') || '';
    if(oc.indexOf(key) === -1) return;
    if(el.type === 'checkbox'){ el.checked = !!v; return; }
    if(el.type === 'file') return;
    const val = el.classList.contains('money-input') ? fmtMoneyInput(v) : (v == null ? '' : String(v));
    if(el.value !== val) el.value = val;
  });
}
/* Sección I y RC: el Modo Rápido usa coverages.*, el avanzado y los documentos usan sums.*
   Estas reglas mantienen ambos iguales. */
const SI_PARTS = ['works','supplies','cpm','temp','debris','fees','extra'];
function _siOthers(c){ return SI_PARTS.filter(k => k!=='works').reduce((a,k)=>a+(+c.sums[k]||0),0); }
function linkSumsFromCoverages(c){
  const si = +c.coverages.A.sum || 0;
  if(si > 0){ const others = _siOthers(c); if(others < si) updPath('sums.works', si - others); }
}
function linkCoverageAFromSums(c){
  const oldA = +c.coverages.A.sum || 0, total = siTotal(c);
  updPath('coverages.A.sum', total);
  ['B','C','D'].forEach(k => { const cur = +c.coverages[k].sum || 0; if(!cur || cur === oldA) updPath('coverages.'+k+'.sum', total); });
  if(c.endorsement_sublimits && (!+c.endorsement_sublimits.mr003 || +c.endorsement_sublimits.mr003 === oldA)) updPath2('endorsement_sublimits','mr003', total);
  syncEnd115(c, oldA);
}
function updDed(i,k,v){ const c=activeCase(); c.deductibles[i][k]=v; save(); }
function updPath2(parent, key, v){ const c=activeCase(); if(!c[parent]) c[parent]={}; c[parent][key]=v; c.updatedAt=new Date().toISOString(); save(); }
/* ===== Helpers de dinero (formatean al teclear y guardan número raw) ===== */
function updMoney(path, input){
  const n = parseMoneyInput(input.value);
  updPath(path, n);
  input.value = n > 0 ? n.toLocaleString('en-US') : '';
  const c = activeCase(); if(!c) return;
  const k = path.split('.')[1];
  if(path.indexOf('sums.') === 0 && SI_PARTS.indexOf(k) !== -1) linkCoverageAFromSums(c);
  else if(path === 'coverages.A.sum'){ linkSumsFromCoverages(c); syncEnd115(c, c._lastSIForEnd115); c._lastSIForEnd115 = +c.coverages.A.sum || 0; }
  else if(path === 'sums.liability_event') updPath('coverages.EF.sum_event', n);
  else if(path === 'sums.liability_agg') updPath('coverages.EF.sum_agg', n);
  else if(path === 'coverages.EF.sum_event') updPath('sums.liability_event', n);
  else if(path === 'coverages.EF.sum_agg') updPath('sums.liability_agg', n);
}
function updMoney2(parent, key, input){
  const n = parseMoneyInput(input.value);
  updPath2(parent, key, n);
  input.value = n > 0 ? n.toLocaleString('en-US') : '';
}
/* Variante que también sincroniza coberturas B/C/D y G.max al cambiar A.sum */
function updMoneySync(path, input){
  updMoney(path, input);
  syncCoverages();
  render();
}
/* Variante para Sección II — RC por evento auto-iguala el agregado */
function updMoneyRC(input){
  const n = parseMoneyInput(input.value);
  updPath('coverages.EF.sum_event', n);
  updPath('coverages.EF.sum_agg', n);
  updPath('sums.liability_event', n);
  updPath('sums.liability_agg', n);
  input.value = n > 0 ? n.toLocaleString('en-US') : '';
}

function updMoneyQuote(i, k, input){

}

function quoteVsSlip(q, c){
  const req = requestedEndorsements(c);
  const rows = req.map(r => {
    const status = getAcceptanceStatus(q, r.code);
    const want = requestedSublimit(c, r.id);
    const got = +((q.endorsement_sublimits || {})[r.id]) || 0;
    const low = status !== 'rejected' && want > 0 && got > 0 && got < want;
    return { ...r, status: status, want: want, got: got, low: low };
  });
  const by = st => rows.filter(x => x.status === st);
  const missing = rows.filter(x => x.status !== 'accepted');
  return { rows: rows, accepted: by('accepted'), rejected: by('rejected'), modified: by('modified'), unknown: by('unknown'),
           missing: missing, low: rows.filter(x => x.low), total: rows.length };

/* Convierte un deducible en un número comparable: % si lo trae, si no el monto */
function dedMeasure(t){
  const s = String(t || '').toLowerCase();
  const pct = s.match(/(\d+(?:[.,]\d+)?)\s*%/);
  const amt = s.match(/(?:rd\$|us\$|usd|dop|\$)?\s*([\d][\d,.]{3,})/);
  return { pct: pct ? parseFloat(pct[1].replace(',', '.')) : null, amt: amt ? parseMoneyInput(amt[1]) : null };
}
/* -1 = mejor (más bajo) que lo pedido · 0 = igual · 1 = peor · null = no comparable */
function dedCompare(asked, offered){
  if(!asked || !offered) return null;
  const a = dedMeasure(asked), o = dedMeasure(offered);
  const cmp = (x, y) => Math.abs(x - y) < 1e-9 ? 0 : (y < x ? -1 : 1);
  if(a.pct != null && o.pct != null){ const r = cmp(a.pct, o.pct); if(r !== 0) return r; }
  if(a.amt != null && o.amt != null) return cmp(a.amt, o.amt);
  if(a.pct != null && o.pct != null) return 0;
  return null;
}

/* Separa un texto de deducibles en los tres campos */
function splitDeductibles(text){
  const out = { cat:'', otros:'', rc:'' };
  const t = String(text || ''); if(!t.trim()) return out;
  const parts = t.split(/\s*[·;\n|•]\s*/).map(x => x.trim()).filter(Boolean);
  const clean = (x, k) => {
    let v = x.replace(/^deducibles?\s*[:\-–]?\s*/i, '').replace(/^sec(ci[oó]n)?\.?\s*(i{1,2})\b\s*[:\-–]?\s*/i, '');
    const lead = { cat: /^(deducibles?\s+)?(catastr[oó]fic[oa]s?|riesgos\s+catastr[oó]ficos|terremoto[^:]*?|fen[oó]menos\s+naturales)\s*[:\-–]?\s*/i,
                   otros: /^(deducibles?\s+)?(otros\s+riesgos|dem[aá]s\s+riesgos|todo\s+otro\s+riesgo|aop)\s*[:\-–]?\s*/i,
                   rc: /^(deducibles?\s+)?(tpl|rc|responsabilidad\s+civil|da[ñn]os\s+a\s+terceros|terceros)\s*[:\-–]?\s*/i }[k];
    v = v.replace(/^[^:\d]{0,45}:\s*/, '');   /* "Terremoto y huracán: 2%…" → "2%…" */
    v = v.replace(lead, '');
    /* corta texto que no es del deducible y viene pegado después del monto */
    const tail = v.match(/\d\s+([A-ZÁÉÍÓÚ][a-záéíóúñ]+)\b/);
    if(tail && !/^(Por|M[ií]n|M[ií]nimo|M[aá]x|M[aá]ximo|Del|De|Cada|Sobre|En|Para|Y|O)$/.test(tail[1])) v = v.slice(0, tail.index + 1);
    v = v.split(/\.\s+(?=[A-ZÁÉÍÓÚÑ][a-záéíóúñ])/)[0];   /* hasta el final de la frase */
    if(v.length > 120) v = v.slice(0, 120).replace(/\s+\S*$/, '') + '…';
    return v.trim();
  };
  ['rc','otros','cat'].forEach(k => {
    const def = DED_KINDS.find(d => d.k === k);
    const i = parts.findIndex(x => def.find.test(x));
    if(i !== -1){ out[k] = clean(parts[i], k); parts.splice(i, 1); }
  });
  return out;
}

function askedDeductible(c, k){

function dedGuess(q, g){
  const txt = String(q.deductibles_proposed || ''); if(!txt) return '';
  const parts = txt.split(/\s*[·;\n|]\s*/).map(x => x.trim()).filter(Boolean);
  const key = ((g.type || '') + ' ' + (g.type ? '' : (g.section || ''))).toLowerCase();
  let test = null;
  if(/otros/.test(key)) test = /otros|dem[aá]s|todo otro|cualquier otro/i;
  else if(/catastr|terremoto|hurac|\(b|b y c|b, c/.test(key)) test = /catastr|terremoto|hurac|cicl|inund|tembl/i;
  else if(/\brc\b|tercer|tpl|secci[oó]n ii/.test(key)) test = /tpl|\brc\b|terceros|secci[oó]n ii|sec\.?\s*ii/i;
  else if(/mantenim/.test(key)) test = /mantenim/i;
  else if(/prueba|t&c/.test(key)) test = /prueba|testing/i;

function scoreQuotes(c){
  const quotes = activeQuotes(c);
  if(quotes.length === 0) return [];
  const W = scoreWeights();
  const prices = quotes.map(q => +q.premiumTotal || 0);
  const minP = Math.min(...prices.filter(p => p > 0)) || 0;
  const maxP = Math.max(...prices) || 1;
  const groups = c.deductibles || [];
  return quotes.map(q => {
    /* Precio: la más barata = 100, la más cara = 0 */
    const priceScore = maxP === minP ? 100 : Math.round(((maxP - +q.premiumTotal) / (maxP - minP)) * 100);
    /* Deducibles: por grupo contra lo pedido; si no hay, lectura del texto de la cotización */
    let dedScore = null;
    const cmps = DED_KINDS.map(d => dedCompare(askedDeductible(c, d.k), quoteDeductible(q, d.k).v)).filter(x => x !== null);
    if(cmps.length){
      dedScore = Math.round(cmps.reduce((a, r) => a + (r < 0 ? 100 : r === 0 ? 85 : 45), 0) / cmps.length);
    } else {
      const dedText = (q.deductibles_proposed || '').toLowerCase();
      dedScore = 60;
      if(/1\.5%|1,5%/.test(dedText)) dedScore += 20;
      else if(/2%|2\.0%|2,0%/.test(dedText)) dedScore += 10;
      else if(/2\.5%|2,5%/.test(dedText)) dedScore -= 5;
      else if(/3%|3\.0%|3,0%/.test(dedText)) dedScore -= 15;
      if(/exclus/.test(dedText)) dedScore -= 5;
      dedScore = Math.max(0, Math.min(100, dedScore));
    }
    const totalScore = Math.round(priceScore * W.price + dedScore * W.deductibles);
    return {
      q, totalScore, priceScore, dedScore,
      isBestPrice:  +q.premiumTotal === minP && minP > 0,
      isWorstPrice: +q.premiumTotal === maxP && quotes.length > 1 && maxP !== minP,
    };
  }).sort((a,b) => b.totalScore - a.totalScore);
}

/* Normaliza un código de cláusula a una forma canónica para matching.
   Acepta: "End. 001", "Endoso 001", "Endoso 1", "Cobertura A", "Cob. E + F",
   "LMA 3100", "NMA 2842", "CL 370", "RC Vibración", "End. 120", etc.
   Retorna: "001", "EF", "LMA3100", "VIB"... o null si no encuentra patrón. */
function normalizeEndoCode(text){
  if(!text) return null;
  const t = String(text).toLowerCase().replace(/\s+/g,' ').trim();
  /* Vibración (End. 120 / RC Vibración / Vibration) */
  if(/vibrac|vibrat|end\.?\s*0?120/.test(t)) return 'VIB';
  /* Cobertura E + F (combinada — RC + RC Cruzada) */
  if(/cobertura.*?["']?e["']?\s*[+y&]\s*["']?f|cobertura.*?ef|\be\s*\+\s*f\b|cob\.?\s*ef/.test(t)) return 'EF';
  /* Cobertura individual A-G */
  let m = t.match(/cob(?:ertura)?\.?\s*["']?([a-g])["']?\b/);
  if(m) return m[1].toUpperCase();
  /* Familias internacionales LMA / NMA / CL */
  m = t.match(/lma\s*(\d+)/);  if(m) return 'LMA' + m[1];
  m = t.match(/nma\s*(\d+)/);  if(m) return 'NMA' + m[1];
  m = t.match(/\bcl\s*(\d+)/); if(m) return 'CL'  + m[1];
  /* Endoso NNN (con o sin ceros) */
  m = t.match(/(?:endoso|end\.?)\s*(\d{1,3})\b/);
  if(m) return m[1].padStart(3, '0');
  /* SRCC / Cross / RC mention */
  if(/srcc|huelga.*motin|motin.*huelga/.test(t)) return '001';
  if(/cross.*liab|rc.*cruzad/.test(t)) return '002';
  return null;
}
/* Detecta si una cláusula/cobertura está aceptada/rechazada/modificada por una cotización.
   Matching robusto basado en código normalizado. */
function getAcceptanceStatus(quote, codeOrTitle){
  if(!quote) return 'unknown';
  const targetCode = normalizeEndoCode(codeOrTitle);
  if(!targetCode){
    /* Fallback: matching textual tolerante */
    const search = String(codeOrTitle).toLowerCase().trim();
    const textMatch = (list) => (list||[]).some(it => String(it).toLowerCase().includes(search));
    if(textMatch(quote.clauses_modified)) return 'modified';
    if(textMatch(quote.clauses_rejected)) return 'rejected';
    if(textMatch(quote.clauses_accepted)) return 'accepted';
    return 'unknown';
  }
  const matchAny = (list) => (list||[]).some(item => normalizeEndoCode(item) === targetCode);
  if(matchAny(quote.clauses_modified)) return 'modified';
  if(matchAny(quote.clauses_rejected)) return 'rejected';
  if(matchAny(quote.clauses_accepted)) return 'accepted';
  return 'unknown';
}

  if(winner.priceScore >= 80) reasons.push('una de las primas más competitivas del mercado');
  else if(winner.priceScore >= 50) reasons.push('una prima razonable dentro del rango cotizado');
  if(winner.dedScore >= 75) reasons.push('deducibles bajos y competitivos');
  /* Composición del texto */
  const reasonsText = reasons.length > 0
    ? reasons.length === 1 ? reasons[0] : reasons.slice(0,-1).join(', ') + ' y ' + reasons.slice(-1)
    : 'el mejor balance entre prima y deducibles';
  const secondPlace = scored[1];
  let competitorNote = '';
  if(secondPlace){
    const secondIns = DEFAULT_INSURERS.find(i => i.id === secondPlace.q.insurerId);
    const priceDiff = (+secondPlace.q.premiumTotal) - (+winner.q.premiumTotal);
    if(priceDiff > 0){

async function generateProposalPPT(){
  const c = activeCase(); if(!c) return;
  if(typeof PptxGenJS === 'undefined'){ alert('La librería de PowerPoint no cargó. Revisa tu conexión a internet.'); return; }
  const d = proposalData(c);
  syncToast('Generando presentación…', true);
  let ai = null;
  try{ ai = await fetchProposalNarrative(d); }
  catch(e){ console.warn('IA propuesta no disponible, uso datos locales:', e); ai = fallbackNarrative(d); }
  if(!ai || !ai.deducibles) ai = Object.assign(fallbackNarrative(d), ai||{});
  try{
    const P = buildProposalDeck(c, d, ai);
    await P.writeFile({ fileName:'Propuesta-'+((c.ref||'TRC').replace(/[^a-zA-Z0-9_-]/g,'_'))+'.pptx' });
    syncToast('Presentación lista ✓', true);
  }catch(e){ console.error(e); syncToast('⚠ No se pudo generar el PPT: '+_errTxt(e), false); }
}

/* ============================================================
   VISTA: COMPARADOR DE COTIZACIONES

function viewCompare(c){
  const ccy = c.header.currency, sym = ccy === 'USD' ? 'US$' : 'RD$';
  const M = v => (+v > 0) ? sym + ' ' + Math.round(+v).toLocaleString('en-US') : '—';
  const insOf = id => DEFAULT_INSURERS.find(i => i.id === id);
  const nameOf = id => { const i = insOf(id); return i ? i.name : id; };
  const scored = scoreQuotes(c);
  const scoreOf = q => scored.find(s => s.q === q);
  const priced = c.quotes.filter(q => +q.premiumTotal > 0);
  const minP = priced.length ? Math.min(...priced.map(q => +q.premiumTotal)) : 0;
  const maxP = priced.length ? Math.max(...priced.map(q => +q.premiumTotal)) : 0;
  const W = scoreWeights().raw;
  const ncol = c.quotes.length;
  const group = (title, note) => `<tr class="cmp-group"><td colspan="${ncol + 1}">${title}${note ? `<span>${note}</span>` : ''}</td></tr>`;

  /* ---- Resumen ---- */
  let summary = '';
  if(scored.length){
    const cheapest = scored.slice().sort((a, b) => (+a.q.premiumTotal) - (+b.q.premiumTotal))[0];
    const best = scored[0];
    const diff = (+best.q.premiumTotal) - (+cheapest.q.premiumTotal);
    const pct = cheapest.q.premiumTotal > 0 ? diff / cheapest.q.premiumTotal * 100 : 0;
    const same = best.q === cheapest.q;
    let rec;
    if(same){
      rec = `<strong>${escapeHtml(nameOf(best.q.insurerId))}</strong> es la más barata y la mejor puntuada${best.dedScore >= 85 ? ', con deducibles iguales o mejores que lo pedido' : ''}.`;
    } else {
      rec = `<strong>${escapeHtml(nameOf(best.q.insurerId))}</strong> cuesta ${M(diff)} (${pct.toFixed(1)}%) más que ${escapeHtml(nameOf(cheapest.q.insurerId))}, pero con mejores deducibles.`;
    }
    const isSel = c.proposal && c.proposal.selectedInsurer === best.q.insurerId;
    summary = `
      <div class="cmp-summary">
        <div class="cmp-stat"><div class="cmp-stat-k">Más barata</div><div class="cmp-stat-v">${escapeHtml(nameOf(cheapest.q.insurerId))}</div><div class="cmp-stat-s">${M(cheapest.q.premiumTotal)} prima total</div></div>
        <div class="cmp-stat"><div class="cmp-stat-k">Mejor puntuada</div><div class="cmp-stat-v">${escapeHtml(nameOf(best.q.insurerId))}</div><div class="cmp-stat-s">${best.totalScore}/100 · Precio ${best.priceScore} · Deducibles ${best.dedScore}</div></div>
        <div class="cmp-stat"><div class="cmp-stat-k">Rango de primas</div><div class="cmp-stat-v">${M(maxP - minP)}</div><div class="cmp-stat-s">${minP ? ((maxP - minP) / minP * 100).toFixed(1) : '0'}% entre la más barata y la más cara</div></div>
        <div class="cmp-rec"><div class="cmp-stat-k">Recomendación</div><div class="cmp-rec-t">${rec}</div>
          <button class="btn ${isSel ? 'btn-ghost' : 'btn-primary'} btn-sm" onclick="useInProposal('${best.q.insurerId}')">${isSel ? '✓ Elegida para la Propuesta' : 'Usar en la Propuesta'}</button></div>
      </div>`;
  }

  /* ---- Deducibles (tres campos) ---- */
  const dedRows = DED_KINDS.map(d => {
    const asked = askedDeductible(c, d.k);
    return `<tr><td><strong>${d.label}</strong><div class="cmp-sub">Pedido: ${escapeHtml(asked || '—')}</div></td>${c.quotes.map((q, qi) => {
      const o = quoteDeductible(q, d.k);
      const r = dedCompare(asked, o.v);
      const cls = r === null ? '' : r < 0 ? 'best' : r === 0 ? '' : 'worst';
      return `<td class="${cls}"><input class="input${o.guessed ? ' cmp-guess' : ''}" value="${escapeHtml(o.v)}" placeholder="No indicado" title="${o.guessed ? 'Tomado del texto de la cotización. Corrígelo si hace falta.' : ''}" onchange="updQuoteDed3(${qi},'${d.k}',this.value)"></td>`;
    }).join('')}</tr>`;
  }).join('');

  return `
    <div class="card">
      <div class="card-header">
        <div>
          <h2 class="card-title">Comparador de cotizaciones recibidas</h2>
          <div class="card-subtitle">Sube el PDF de cada aseguradora o escribe los datos. Se comparan primas y deducibles; los deducibles, contra lo que pediste en el Slip.</div>
        </div>
        <button class="btn btn-gold btn-sm" onclick="addQuote()">+ Agregar cotización</button>
      </div>
      ${summary}
      <div class="compare-grid">
        <table>
          <thead>
            <tr>
              <th>Concepto</th>
              ${c.quotes.map((q, idx) => { const ins = insOf(q.insurerId); const sc = scoreOf(q); return `<th style="min-width:180px">
                <div style="display:flex;flex-direction:column;align-items:flex-start;gap:6px">
                  <div style="display:flex;align-items:center;gap:8px">
                    <span class="insurer-mark" style="background:${ins?.color || '#666'};width:24px;height:24px;font-size:10px">${ins?.short || '?'}</span>
                    <strong style="font-size:12px">${ins ? ins.name : q.insurerId}</strong>
                  </div>
                  ${q.extraction ? `<div class="cmp-file" title="${escapeHtml(q.extraction.filename || '')}">📎 ${escapeHtml((q.extraction.filename || 'PDF leído').slice(0, 34))}</div>` : ''}
                  <div style="display:flex;gap:4px;align-items:center">
                    <button class="btn btn-primary btn-sm" onclick="triggerPdfUpload(${idx})" title="Subir PDF de cotización" style="padding:4px 8px;font-size:11px">📄 ${q.extraction ? 'Otro PDF' : 'Importar PDF'}</button>
                    <button class="btn btn-ghost btn-sm" onclick="reopenQuoteReview(${idx})" title="${q.extraction ? 'Abrir lo leído del PDF y corregirlo' : 'Escribir o corregir los datos de esta cotización'}" style="padding:4px 8px;font-size:11px">✎ Revisar</button>
                    <button class="btn btn-ghost btn-sm" onclick="rmQuote('${q.insurerId}')" title="Quitar" style="padding:4px 8px;font-size:11px">×</button>
                    ${sc ? `<span class="cmp-score-pill">${sc.totalScore}</span>` : ''}
                  </div>

/* Estado de un endoso en una cotización: clic para pasar a la siguiente marca */
function cycleEndoStatus(qi, code){
  const c = activeCase(); const q = c.quotes[qi]; if(!q) return;
  const order = ['accepted','rejected','modified','unknown'];
  const cur = getAcceptanceStatus(q, code);
  const next = order[(order.indexOf(cur) + 1) % order.length];
  const target = normalizeEndoCode(code);
  const strip = list => (list || []).filter(x => normalizeEndoCode(x) !== target);
  q.clauses_accepted = strip(q.clauses_accepted); q.clauses_rejected = strip(q.clauses_rejected); q.clauses_modified = strip(q.clauses_modified);
  if(next === 'accepted') q.clauses_accepted.push(code);
  if(next === 'rejected') q.clauses_rejected.push(code);
  if(next === 'modified') q.clauses_modified.push(code);
  save(); render();
}
function updQuoteSublimit(qi, id, input){
  const c = activeCase(); const q = c.quotes[qi]; if(!q) return;
  const n = parseMoneyInput(input.value);
  q.endorsement_sublimits = q.endorsement_sublimits || {};
  if(n > 0) q.endorsement_sublimits[id] = n; else delete q.endorsement_sublimits[id];
  save(); render();
}
function updQuoteDed3(qi, k, v){
  const c = activeCase(); const q = c.quotes[qi]; if(!q) return;
  q.deductibles3 = Object.assign({ cat:'', otros:'', rc:'' }, q.deductibles3 || {});
  DED_KINDS.forEach(d => { if(!q.deductibles3[d.k]) q.deductibles3[d.k] = quoteDeductible(q, d.k).v; });
  q.deductibles3[k] = String(v || '').trim();
  q.deductibles_proposed = composeDeductibles(q.deductibles3);
  save(); render();
}
function updQuoteDed(qi, gi, v){
  const c = activeCase(); const q = c.quotes[qi]; if(!q) return;
  q.deductibles_by_group = q.deductibles_by_group || {};

function setScoreWeight(k, v){

/* ============================================================
   VISTA: CALCULADORA INTERNA DE PRIMA
   ============================================================ */
function viewCalc(c){
  const bench = RATE_BENCHMARKS[c.interest.workType] || RATE_BENCHMARKS.other;
  const benchRate = bench.base;
  /* Tasa editable: si el usuario ingresó un override, se usa; si no, usa el benchmark */
  const customRate = (c.calcRate !== '' && c.calcRate !== undefined && c.calcRate !== null) ? +c.calcRate : null;
  const loadedRate = (customRate !== null && customRate > 0) ? customRate : benchRate;
  /* SI de Sección I = Cobertura A del formulario (con fallback a la suma legada) */
  const totalSI = (+c.coverages?.A?.sum) || siTotal(c);
  const netPremium = totalSI * (loadedRate/1000);
  const isc = netPremium * (state.config.iscRate/100);
  const totalPremium = netPremium + isc;
  const usingCustom = customRate !== null && customRate > 0;
  return `
    <div class="card">
      <div class="card-header">
        <h2 class="card-title">Calculadora interna de prima</h2>
        <div class="card-subtitle">Benchmark para evaluar las cotizaciones recibidas</div>
      </div>
      <div class="form-grid cols-3">
        <div class="field"><label>Tipo de obra</label><div class="input" style="background:var(--line-2)">${bench.label}</div></div>
        <div class="field">
          <label>Tasa ‰ <span class="hint">${usingCustom ? '(personalizada)' : '(benchmark: '+benchRate.toFixed(2)+')'}</span></label>
          <div class="row" style="gap:6px">
            <input class="input" type="number" step="0.01" min="0" value="${usingCustom ? customRate : benchRate}" onchange="updField('calcRate', this.value === '' ? '' : +this.value); render()" style="background:var(--gold-100);font-weight:700;flex:1" placeholder="${benchRate.toFixed(2)}">
            ${usingCustom ? `<button class="btn btn-ghost btn-sm" onclick="updField('calcRate',''); render()" title="Volver al benchmark">↺</button>` : ''}
          </div>
        </div>
        <div class="field"><label>SI Sección I (Cobertura A)</label><div class="input" style="background:var(--line-2);font-weight:700">${fmtMoney(totalSI,c.header.currency)}</div></div>
      </div>
      <div class="sep"></div>
      <div class="kpi-row">
        <div class="kpi"><div class="kpi-label">Prima neta benchmark</div><div class="kpi-value">${fmtMoney(netPremium,c.header.currency)}</div></div>
        <div class="kpi"><div class="kpi-label">ISC ${state.config.iscRate}%</div><div class="kpi-value">${fmtMoney(isc,c.header.currency)}</div></div>
        <div class="kpi"><div class="kpi-label">Prima total benchmark</div><div class="kpi-value">${fmtMoney(totalPremium,c.header.currency)}</div></div>
      </div>
      <div class="section-title">Comparación contra cotizaciones recibidas</div>
      <table>
        <thead><tr><th>Aseguradora</th><th>Tasa ‰</th><th style="text-align:right">Prima neta</th><th style="text-align:right">Δ vs. benchmark</th></tr></thead>
        <tbody>
          ${c.quotes.map(q => {
            const ins=DEFAULT_INSURERS.find(i=>i.id===q.insurerId);
            const delta = q.premiumNet - netPremium;
            const pct = (delta / netPremium) * 100;
            const color = pct < -5 ? 'color:var(--ok)' : pct > 10 ? 'color:var(--bad)' : 'color:var(--ink-700)';
            return `<tr>
              <td>${ins?ins.name:q.insurerId}</td>
              <td>${q.rate}‰</td>
              <td style="text-align:right">${fmtMoney(q.premiumNet,c.header.currency)}</td>
              <td style="text-align:right;${color};font-weight:600">${delta>=0?'+':''}${fmtMoney(delta,c.header.currency)} (${pct>=0?'+':''}${pct.toFixed(1)}%)</td>
            </tr>`;
          }).join('')}
          ${c.quotes.length===0?'<tr><td colspan="4" class="empty">Sin cotizaciones registradas todavía</td></tr>':''}
        </tbody>
      </table>
    </div>
  `;
}

/* ============================================================
   RENDERERS DEDICADOS PARA WORD
   HTML simple, table-based, sin flex/grid/var() — Word lo renderiza bien.
   ============================================================ */
const W_BLUE='#004A88', W_ORANGE='#FF5200', W_GRAY='#6b7280', W_LINE='#d0d4dc', W_LIGHT='#f8f9fb';
/* Tabla key-value 2 columnas, Word-friendly */
function wKv(rows){
  return `<table style="border-collapse:collapse;width:100%;margin:4pt 0;font-family:Arial,sans-serif;font-size:10pt">${
    rows.map(([k,v]) => `<tr>
      <td style="padding:3pt 8pt 3pt 0;font-weight:600;color:#374151;width:32%;vertical-align:top">${escapeHtml(k)}</td>
      <td style="padding:3pt 0;color:#1a1f2e;vertical-align:top">${v||'—'}</td>
    </tr>`).join('')
  }</table>`;
}
/* Tabla genérica con headers y filas, Word-friendly */
function wTable(headers, rows, opts={}){
  const widths = opts.widths || [];
  return `<table style="border-collapse:collapse;width:100%;margin:6pt 0;font-family:Arial,sans-serif;font-size:9.5pt;border:0.5pt solid ${W_LINE}">
    <thead><tr>${headers.map((h,i) => `<th style="background:${W_BLUE};color:#fff;padding:5pt 7pt;text-align:${i===headers.length-1&&opts.lastRight?'right':'left'};font-weight:600;font-size:9pt${widths[i]?';width:'+widths[i]:''}">${h}</th>`).join('')}</tr></thead>
    <tbody>${rows.map((r,ri) => `<tr style="background:${ri%2?W_LIGHT:'#ffffff'}">${r.map((cell,ci) => `<td style="padding:4pt 7pt;border-bottom:0.3pt solid ${W_LINE};text-align:${ci===headers.length-1&&opts.lastRight?'right':'left'};vertical-align:top">${cell}</td>`).join('')}</tr>`).join('')}</tbody>
  </table>`;
}
/* H2 estilo Garrigo para Word */
function wH2(num, title){
  return `<h2 style="font-family:Arial,sans-serif;color:${W_BLUE};font-size:13pt;margin:14pt 0 6pt;border-bottom:1.5pt solid ${W_ORANGE};padding-bottom:3pt"><span style="color:${W_ORANGE};font-weight:700;margin-right:6pt">${num}</span>${title}</h2>`;
}
function wH3(title){
  return `<h3 style="font-family:Arial,sans-serif;color:#0A5AA0;font-size:11pt;margin:8pt 0 4pt">${title}</h3>`;
}
/* ===== SLIP WORD-FRIENDLY ===== */

    ['RNC', escapeHtml(c.insured.rnc)],
    ['Dirección', escapeHtml(c.insured.address)],
    ['Actividad', escapeHtml(c.insured.activity)],
    ['Principal', escapeHtml(c.insured.principal)],
    ['Contratista', escapeHtml(c.insured.contractor)],
    ['Subcontratistas', escapeHtml(c.insured.subs)],

    ['Mantenimiento', `${c.period.maintMonths} meses (${escapeHtml(c.period.maintType)})`],

  const interesRows = [

  ];
  if(c.interest.progress) interesRows.push(['Avance al inicio de cobertura', `<strong style="color:#004A88">${escapeHtml(c.interest.progress)}</strong>`]);
  out += wKv(interesRows);
  /* 4. Coberturas A-G */
  out += wH2('4', 'Coberturas y Sumas Aseguradas');
  out += `<p style="font-size:9pt;color:#6b7280;margin:2pt 0">Nomenclatura Munich Re LATAM</p>`;
  out += wTable(
    ['Cobertura', 'Descripción', `Suma (${ccy})`],

      ['<strong>RC Cruzada</strong>', 'Cross Liability (End. 002)', c.sums.crossLiab?'<strong>Sí</strong>':'No'],

    { lastRight: true, widths:['18%','55%','27%'] }

  /* Sub-límites por Endoso. End. 003 SIEMPRE visible al 100% del SI */

    ['mr107','End. 107','Campamentos y Almacenes', c.endorsement_sublimits?.mr107],

/* ===== PROPUESTA WORD-FRIENDLY ===== */
function renderWordProposal(c){
  const ccy = c.header.currency;
  const M = v => fmtMoney(v, ccy);
  const filled = activeQuotes(c);
  const insLookup = id => DEFAULT_INSURERS.find(i => i.id === id);
  const insName = id => { const i=insLookup(id); return i?i.name:(id||'—'); };
  const selRaw = c.proposal.selectedInsurer ? c.quotes.find(q => q.insurerId === c.proposal.selectedInsurer) : null;
  const sel = selRaw && hasQuoteData(selRaw) ? selRaw : null;
  const scored = scoreQuotes(c);
  const selScore = sel ? ((scored.find(s=>s.q.insurerId===sel.insurerId)||{}).totalScore) : null;
  let out = '';
  out += `<p style="text-align:center;color:${W_GRAY};font-style:italic;margin:-6pt 0 12pt;font-family:Arial,sans-serif">Preparada para ${escapeHtml(c.insured.name||'—')} · ${fmtDate(c.header.dateIssue || (typeof _todayStr==='function'?_todayStr():''))}</p>`;
  if(sel){
    out += `<div style="background:${W_BLUE};color:#fff;border-radius:6pt;padding:14pt 18pt;margin:6pt 0 14pt;text-align:center;font-family:Arial,sans-serif">
      <div style="font-size:8pt;text-transform:uppercase;letter-spacing:2pt;opacity:.85">Recomendación de Garrigó</div>
      <div style="font-size:18pt;font-weight:800;margin:3pt 0">${escapeHtml(insName(sel.insurerId))}</div>
      <div style="font-size:9pt">Prima total ${M(sel.premiumTotal)} &nbsp;·&nbsp; Puntaje ${selScore!=null?selScore+'/100':'—'} &nbsp;·&nbsp; Suma asegurada ${M(siTotal(c))}</div>
    </div>`;
    if(c.proposal.recommendation) out += `<p style="font-size:10pt;color:#374151;font-family:Arial,sans-serif;margin:0 0 12pt">${escapeHtml(c.proposal.recommendation)}</p>`;
  } else {
    out += `<div style="background:#fff7ed;border:1pt solid ${W_ORANGE};border-radius:6pt;padding:10pt 14pt;margin:6pt 0 12pt;color:#78350f;font-size:10pt;font-family:Arial,sans-serif">Selecciona la aseguradora recomendada en el Comparador para completar esta propuesta.</div>`;
  }
  out += wH2('1', 'Resumen del proyecto');
  out += wKv([
    ['Proyecto', escapeHtml(c.interest.description||'—')],
    ['Ubicación', escapeHtml(c.interest.location||'—')],
    ['Vigencia', ((c.period.constStart && c.period.constEnd) ? fmtDate(c.period.constStart)+' al '+fmtDate(c.period.constEnd) : (c.period.constMonths||12)+' meses') + ` + ${c.period.maintMonths||0}m mant.`],
    ['Suma asegurada (Sec. I)', M(siTotal(c))],
    ['Responsabilidad Civil', `${M(c.sums.liability_event)} por evento`]
  ]);
  out += wH2('2', 'Comparación de opciones');
  if(!filled.length){
    out += `<p style="font-style:italic;color:${W_GRAY};font-family:Arial,sans-serif;font-size:10pt">Pendiente: aún no se han recibido cotizaciones.</p>`;
  } else {
    out += wTable(['Aseguradora','Prima total','Puntaje'],
      scored.map(s => [ insName(s.q.insurerId) + (sel && s.q.insurerId===sel.insurerId ? ' ✓ recomendada' : ''), M(s.q.premiumTotal), s.totalScore+'/100' ]));
  }
  out += wH2('3', 'Coberturas y sumas aseguradas');
  out += wTable(['Cobertura','Descripción','Suma ('+ccy+')'], coverageRows(c).map(cv=>[cv.code, cv.desc, cv.sum>0?M(cv.sum):'Incluido']), { lastRight:true });
  out += wH2('4', 'Deducibles principales');
  if(sel && sel.deductibles_proposed){
    out += `<p style="font-family:Arial,sans-serif;font-size:10pt;color:#374151;white-space:pre-line">${escapeHtml(sel.deductibles_proposed)}</p>`;
  } else if(c.deductibles && c.deductibles.length){
    out += `<ul style="font-family:Arial,sans-serif;font-size:10pt;color:#374151;line-height:1.6;padding-left:16pt">${c.deductibles.map(d=>`<li>${escapeHtml((d.section?d.section+' — ':'')+(d.type?d.type+': ':'')+(d.value||''))}</li>`).join('')}</ul>`;
  } else {
    out += `<p style="font-style:italic;color:${W_GRAY};font-family:Arial,sans-serif;font-size:10pt">Por definir según póliza emitida.</p>`;
  }
  out += wH2('5', 'Próximos pasos');
  out += `<ol style="font-family:Arial,sans-serif;font-size:10pt;color:#374151;line-height:1.6;padding-left:16pt">
    <li>Confirmar la aseguradora seleccionada.</li>
    <li>Emisión de la póliza y envío de la factura.</li>
    <li>Pago de la prima para activar la cobertura.</li>
  </ol>`;
  return out;
}
/* Colores para documentos Word/PDF (papel blanco): la app usa tema oscuro,
   así que cada variable CSS se traduce a su color "de imprenta". */
const CSS_VAR_TO_HEX = {
  '--grg-blue':'#004A88', '--grg-blue-dk':'#00335E', '--grg-blue-2':'#0A5AA0', '--grg-blue-lt':'#3A7AC4',
  '--grg-blue-bg':'#EAF1F9', '--grg-orange':'#FF5200', '--grg-orange-2':'#FF6B3D', '--grg-orange-lt':'#FFF1EA',
  '--grg-gray':'#918F8F', '--grg-gray-lt':'#C7C9CC', '--grg-dark':'#231F20',
  '--navy-900':'#00335E', '--navy-800':'#004A88', '--navy-700':'#004A88', '--navy-600':'#0A5AA0', '--navy-500':'#3A7AC4',
  '--gold-500':'#FF5200', '--gold-400':'#FF6B3D', '--gold-300':'#FFB89A', '--gold-100':'#FFF1EA',
  '--ink-900':'#1a1f2e', '--ink-700':'#374151', '--ink-500':'#6b7280', '--ink-300':'#9ca3af',
  '--line':'#d0d4dc', '--line-2':'#eef1f5', '--bg':'#ffffff', '--white':'#ffffff',
  '--surface':'#ffffff', '--surface-2':'#f7f8fa', '--num':'#004A88',
  '--ok':'#16a34a', '--warn':'#d97706', '--bad':'#dc2626'
};
function htmlToWordCompatible(html){
  /* 1. Sustituir CSS variables por colores hex concretos */
  let out = html;
  for(const [varName, hex] of Object.entries(CSS_VAR_TO_HEX)){
    out = out.split(`var(${varName})`).join(hex);
  }
  /* 2. Quitar linear-gradient (no soportado por Word) */
  out = out.replace(/background:\s*linear-gradient\([^)]*\)\s*;?/gi, 'background:#ffffff;');
  out = out.replace(/background-image:\s*linear-gradient\([^)]*\)\s*;?/gi, '');
  /* 3. Quitar border-radius (a veces causa problemas en Word) — opcional */
  /* out = out.replace(/border-radius:[^;"]*;?/g, ''); */
  /* 4. Reemplazar grid layout por table (mejor compat con Word) */
  out = out.replace(/display:\s*grid\s*!important;/g, 'display:table;');
  out = out.replace(/display:\s*grid;/g, 'display:table;');
  return out;
}
/* Espera (con polling) a que una variable global esté disponible */
async function waitForGlobal(name, timeoutMs = 3500){
  if(typeof window[name] !== 'undefined') return true;
  const start = Date.now();
  while(Date.now() - start < timeoutMs){
    await new Promise(r => setTimeout(r, 100));
    if(typeof window[name] !== 'undefined') return true;
  }
  return false;
}

/* ============================================================
   EXTRACCIÓN DE PDF DE COTIZACIÓN
   PDF.js extrae texto, heurística saca primas/deducibles/coberturas
   ============================================================ */
async function extractPdfText(file){
  const buffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
  let fullText = '';
  for(let i = 1; i <= pdf.numPages; i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    /* Reconstruir con saltos de línea aproximados según posición Y */
    let lastY = null, line = '';
    for(const item of content.items){
      const y = item.transform?.[5];
      if(lastY !== null && Math.abs(y - lastY) > 4){
        fullText += line.trim() + '\n';
        line = '';
      }
      line += item.str + ' ';
      lastY = y;
    }
    fullText += line.trim() + '\n';
  }
  return fullText;
}
/* ============================================================
   EXTRACTOR PDF ESTRUCTURADO
   Divide el cover letter en secciones, extrae lo correcto de cada
   una (los endosos en "Condiciones" son aceptados, los de "Exclusiones"
   son rechazados), mapea sub-límites por endoso, verifica consistencia.
   ============================================================ */
/* Marcadores de secciones típicas en cover letters dominicanos */
const PDF_SECTION_MARKERS = {
  vigencia:              /\b(vigencia\s*:)/i,
  obra:                  /\bobra\s+asegurada\s*:/i,
  ubicacion:             /\bubicaci[óo]n\s+de\s+la\s+obra\s*:/i,
  interes:               /\bin?ter[ée]s\s*:/i,
  sumas:                 /\b(sumas?\s*\/?\s*l[íi]mites?\s+asegurados?\s*:)/i,
  condiciones:           /(?<!adicionales\s)condiciones\s*:(?!\s*adicionales)/i,
  condicionesAdicionales: /\bcondiciones\s+adicionales\s*:/i,
  exclusiones:           /\bexclusiones\s*:/i,
  deducibles:            /\bdeducibles\s*:/i,
  prima:                 /\bprima\s*:\s*(?:RD\$|US\$|\$|DOP|USD)?/i,
  cesion:                /\bendoso\s+de\s*\n?\s*cesi[óo]n\s*:/i,
};
/* Divide el texto del PDF en secciones, usando los marcadores de encabezados.
   Retorna { secName: { text, start, end }, ... } */
function splitPdfSections(text){
  const positions = [];
  for(const [name, regex] of Object.entries(PDF_SECTION_MARKERS)){
    /* Permitir varias coincidencias (a veces "Continuación Condiciones" o "Continuación Exclusiones") */
    let m;
    const globalRe = new RegExp(regex.source, regex.flags + 'g');
    while((m = globalRe.exec(text)) !== null){
      positions.push({ name, idx: m.index, length: m[0].length });
    }
  }
  positions.sort((a, b) => a.idx - b.idx);
  const sections = {};
  for(let i = 0; i < positions.length; i++){
    const p = positions[i];
    const start = p.idx + p.length;
    const end = i+1 < positions.length ? positions[i+1].idx : text.length;
    const body = text.substring(start, end).trim();
    /* Concatenar si el nombre ya existe (caso continuación) */
    if(sections[p.name]){
      sections[p.name].text += '\n' + body;
      sections[p.name].end = end;
    } else {
      sections[p.name] = { text: body, start, end };
    }
  }
  return sections;
}
/* Extrae endosos + sub-límites de una sección dada.
   Retorna { codes: [...nombres...], sublimits: { mrXXX: monto } } */
function extractEndosesFromSection(secText){
  const out = { codes: new Set(), sublimits: {} };
  if(!secText) return { codes: [], sublimits: {} };
  /* Patrón: "Endoso NNN [descripción 0-180 chars] [opcional: RD$ XXX.XXX.XXX]"
     Termina antes del próximo "Endoso", "Cobertura" o salto de párrafo doble. */
  const endRe = /endoso\s*(\d{1,3})\b\s*([^\n]{0,200}?)(?:(RD\$|US\$|\$)\s*([\d,.]+))?(?=\s*endoso\s|\s*cobertura\s|\s*\n|$)/gi;
  let m;
  while((m = endRe.exec(secText)) !== null){
    const num = m[1].padStart(3,'0');
    const fieldId = 'mr' + num;
    const desc = (m[2]||'').trim().slice(0,60);
    out.codes.add(`End. ${num}${desc ? ' '+desc : ''}`);
    if(m[4]){
      const val = parseMoneyInput(m[4]);
      if(val > 0) out.sublimits[fieldId] = val;
    }
  }
  /* Coberturas A-G */
  const cobRe = /cobertura\s*["']?([A-G])["']?\s*[:\-]?\s*([^.\n]{0,80})/gi;
  while((m = cobRe.exec(secText)) !== null){
    out.codes.add(`Cobertura ${m[1]}`);
  }
  /* "Cobertura E y F" combinado */
  if(/cobertura\s*["']?e["']?\s*[+y&]\s*["']?f/i.test(secText)){
    out.codes.add('Cobertura E y F');
  }
  /* RC Vibración / End. 120 */
  if(/vibrac/i.test(secText)) out.codes.add('End. 120 RC Vibración');
  /* SRCC por nombre */
  if(/srcc|huelga.{0,20}motin/i.test(secText)){
    out.codes.add('End. 001 SRCC');
    /* Si hay monto cerca de SRCC, capturarlo */
    const srccM = secText.match(/(?:srcc|huelga[^.\n]{0,40}motin)(?:(?!endoso)[^.\n]){0,60}(RD\$|US\$|\$)\s*([\d,.]+)/i);
    if(srccM){ const val = parseMoneyInput(srccM[2]); if(val>0 && !out.sublimits.mr001) out.sublimits.mr001 = val; }
  }
  /* Cross liability por nombre */
  if(/cross.{0,20}liab|cruzad/i.test(secText)) out.codes.add('End. 002 RC Cruzada');
  /* LMA / NMA / CL */
  const lmaRe = /(LMA|NMA)\s*(\d{3,4})/gi;
  while((m = lmaRe.exec(secText)) !== null){
    out.codes.add(`${m[1].toUpperCase()} ${m[2]}`);
  }
  const clRe = /\bCL\s*(\d{3})/gi;
  while((m = clRe.exec(secText)) !== null){
    out.codes.add(`CL ${m[1]}`);
  }
  return { codes: [...out.codes].sort(), sublimits: out.sublimits };
}
/* Extrae prima neta / ISC / prima total de la sección "Prima:" */
function extractPrimaSection(secText){
  const r = {};
  if(!secText) return r;
  /* Primero busca "Prima Total" explícito */
  let m = secText.match(/prima\s+total[^\d]{0,30}(?:RD\$|US\$|DOP|USD|\$)?\s*([\d,.]+)/i);
  if(m) r.premiumTotal = parseMoneyInput(m[1]);
  /* Prima neta */
  m = secText.match(/prima\s+neta[^\d]{0,30}(?:RD\$|US\$|DOP|USD|\$)?\s*([\d,.]+)/i);
  if(m) r.premiumNet = parseMoneyInput(m[1]);
  /* ISC explícito */
  m = secText.match(/isc[^\d]{0,30}(?:RD\$|US\$|\$)?\s*([\d,.]+)/i);
  if(m) r.isc = parseMoneyInput(m[1]);
  /* Si no encontró neta ni total, prueba con el primer monto que ve, que normalmente es la prima */
  if(!r.premiumNet && !r.premiumTotal){
    m = secText.match(/(?:RD\$|US\$|DOP|USD|\$)\s*([\d,.]{4,})/i);
    if(m){
      const val = parseMoneyInput(m[1]);
      /* Si dice "más ISC" después, el monto es la neta; si no, asumir total */
      r[secText.toLowerCase().includes('m[áa]s isc') || /m[áa]s\s+isc/i.test(secText) ? 'premiumNet' : 'premiumNet'] = val;
    }
  }
  return r;
}
/* Extrae sumas aseguradas por sección (I/II) */
function extractSumasSection(secText){
  const r = {};
  if(!secText) return r;
  /* Sección I (Coberturas A, B, C) — Daño Material */
  let m = secText.match(/secci[óo]n\s+i\b[\s\S]{0,250}?(?:RD\$|US\$|\$)\s*([\d,.]+)/i);
  if(m) r.coverageA = parseMoneyInput(m[1]);
  /* Sección II (Coberturas E y F) — RC */
  m = secText.match(/secci[óo]n\s+ii\b[\s\S]{0,250}?(?:RD\$|US\$|\$)\s*([\d,.]+)/i);
  if(m) r.coverageEF = parseMoneyInput(m[1]);
  return r;
}
/* Función pública principal — usa la versión estructurada y agrega warnings */
function findAmountByLabels(text, labels){
  if(!labels || !labels.length || !text) return null;
  for(let i=0;i<labels.length;i++){
    const l = String(labels[i]||'').trim(); if(!l) continue;
    const esc = l.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp(esc + '[^0-9]{0,25}([0-9][0-9.,]{2,})', 'i');
    const m = text.match(re);
    if(m){ const n = parseFloat(String(m[1]).replace(/,/g,'')); if(!isNaN(n)) return n; }
  }
  return null;
}
function extractQuoteFields(text, insurerId){
  const result = { _matches:{}, _warnings:[], _sections:{}, _structured:true };
  const sections = splitPdfSections(text);
  result._sections = Object.keys(sections);
  /* === Sumas aseguradas === */
  if(sections.sumas){
    const sumas = extractSumasSection(sections.sumas.text);
    if(sumas.coverageA){ result.sumSeccionI = sumas.coverageA; result._matches.sumSeccionI = 'Sección I'; }
    if(sumas.coverageEF){ result.sumSeccionII = sumas.coverageEF; result._matches.sumSeccionII = 'Sección II'; }
  }
  /* === Prima === */
  if(sections.prima){
    const prima = extractPrimaSection(sections.prima.text);
    Object.assign(result, prima);
    if(prima.premiumNet) result._matches.premiumNet = sections.prima.text.slice(0,80);
    if(prima.premiumTotal) result._matches.premiumTotal = sections.prima.text.slice(0,80);
    if(prima.isc) result._matches.isc = sections.prima.text.slice(0,80);
  }
  /* Auto-completar prima */
  if(result.premiumNet && !result.premiumTotal && !result.isc){
    result.isc = Math.round(result.premiumNet * 0.16);
    result.premiumTotal = result.premiumNet + result.isc;
    result._warnings.push('ISC y Prima Total no se detectaron explícitamente; calculados como 16% de Prima Neta.');
  } else if(result.premiumNet && result.isc && !result.premiumTotal){
    result.premiumTotal = result.premiumNet + result.isc;
  } else if(result.premiumTotal && !result.premiumNet){
    result.premiumNet = Math.round(result.premiumTotal / 1.16);
    if(!result.isc) result.isc = result.premiumTotal - result.premiumNet;
    result._warnings.push('Prima Neta calculada como Prima Total ÷ 1.16.');
  }
  /* === Verificación: Neta + ISC = Total === */
  if(result.premiumNet && result.isc && result.premiumTotal){
    const expected = result.premiumNet + result.isc;
    const diff = Math.abs(expected - result.premiumTotal);
    if(diff > 100){
      result._warnings.push(`⚠ Inconsistencia: Prima Neta + ISC = ${expected.toLocaleString('en-US')}, pero Prima Total detectada = ${result.premiumTotal.toLocaleString('en-US')} (Δ ${diff.toLocaleString('en-US')}).`);
    }
  }
  /* === Endosos ACEPTADOS (sección Condiciones + Condiciones Adicionales) === */
  const acceptedCodes = new Set();
  let allSublimits = {};
  if(sections.condiciones){
    const r = extractEndosesFromSection(sections.condiciones.text);
    r.codes.forEach(c => acceptedCodes.add(c));
    Object.assign(allSublimits, r.sublimits);
  }
  if(sections.condicionesAdicionales){
    const r = extractEndosesFromSection(sections.condicionesAdicionales.text);
    r.codes.forEach(c => acceptedCodes.add(c));
    Object.assign(allSublimits, r.sublimits);
  }
  result.clauses_accepted = [...acceptedCodes].sort();
  result.endorsement_sublimits = allSublimits;
  /* También como texto multi-línea para el textarea del modal */
  result.clauses_accepted_text = result.clauses_accepted.map(code => {
    const num = code.match(/\d{2,3}/)?.[0];
    const fieldId = num ? 'mr' + num.padStart(3,'0') : null;
    const sub = fieldId && allSublimits[fieldId];
    return code + (sub ? ` — RD$ ${sub.toLocaleString('en-US')}` : '');

  /* === Endosos RECHAZADOS (sección Exclusiones) === */
  const rejectedCodes = new Set();
  if(sections.exclusiones){
    const r = extractEndosesFromSection(sections.exclusiones.text);
    r.codes.forEach(c => rejectedCodes.add(c));
  }
  result.clauses_rejected = [...rejectedCodes].sort();
  result.clauses_rejected_text = result.clauses_rejected.join('\n');
  /* === Deducibles (texto de la sección) === */
  if(sections.deducibles){
    result.deductibles_proposed = sections.deducibles.text.replace(/\s+/g,' ').trim().slice(0,500);
    result._matches.deductibles = sections.deducibles.text.slice(0,80) + '…';
  }
  /* === Verificación: sub-límites no deben exceder SI === */
  if(result.sumSeccionI){
    Object.entries(allSublimits).forEach(([id, val]) => {
      if(val > result.sumSeccionI){
        result._warnings.push(`⚠ Sub-límite ${id} = ${val.toLocaleString('en-US')} excede la SI Sec. I (${result.sumSeccionI.toLocaleString('en-US')}).`);
      }
    });
  }
  /* === Verificación: estándar Garrigo === */
  const garrigoStandard = ['mr001','mr002','mr003','mr004','mr006','mr008','mr013','mr102','mr107','mr110','mr112','mr113','mr119','mr-rc-vib'];
  const acceptedIds = new Set([...acceptedCodes].map(c => {
    const num = c.match(/\d{2,3}/)?.[0];
    return num ? 'mr'+num.padStart(3,'0') : c.toLowerCase();
  }));
  const missing = garrigoStandard.filter(id => !acceptedIds.has(id));
  if(missing.length > 0){
    const codeNames = missing.map(id => id === 'mr-rc-vib' ? 'End. 120 (RC Vibración)' : 'End. ' + id.slice(2));
    result._warnings.push(`ℹ ${missing.length} endoso(s) del estándar Garrigo no detectados en Condiciones (revisar manualmente): ${codeNames.join(', ')}.`);
  }

  if(sections.vigencia){
    const dateRe = /(\d{1,2}[\/\-\.]\d{1,2}[\/\-\.]\d{2,4})/g;
    const dates = [];
    let m;
    while((m = dateRe.exec(sections.vigencia.text)) !== null) dates.push(m[1]);
    if(dates.length >= 2){
      result.vigenciaText = `Del ${dates[0]} al ${dates[1]}`;
    }
  }
  /* Override por plantilla de aseguradora (etiquetas configuradas en Configuración) */
  const _al = (insurerId && state.config.extractAliases) ? state.config.extractAliases[insurerId] : null;
  if(_al){
    ['premiumNet','isc','premiumTotal','sumSeccionI','sumSeccionII'].forEach(fld => {
      const v = findAmountByLabels(text, _al[fld]);
      if(v != null){ result[fld] = v; result._matches[fld] = 'Plantilla aseguradora'; }
    });
    if(result.premiumNet && result.isc && !result.premiumTotal) result.premiumTotal = result.premiumNet + result.isc;
  }
  return result;
}

  const clRe = /\bCL\s*(\d{3})/gi;
  while((cm = clRe.exec(norm)) !== null){
    coberturasFound.add(`CL ${cm[1]}`);
  }
  /* RC Vibración (End. 120) */
  if(/vibrac/.test(norm)) coberturasFound.add('End. 120 — RC Vibración / Debilitamiento');
  /* SRCC / Cross liability mencionados por nombre */
  if(/srcc|huelga.{0,20}motin|motin.{0,20}huelga/.test(norm)) coberturasFound.add('End. 001 SRCC');
  if(/cross.{0,20}liab|cruzad/.test(norm)) coberturasFound.add('End. 002 RC Cruzada');
  result.clauses_accepted_text = [...coberturasFound].sort().join('\n');
  /* --- Sumas Sección I / Sección II --- */
  m = norm.match(/secci[oó]n\s+I[^\d]{0,60}?(?:RD\$|US\$|\$)\s*([\d,.]+)/i);
  if(m){ result.sumSeccionI = parseMoneyInput(m[1]); result._matches.sumSeccionI = m[0]; }
  m = norm.match(/secci[oó]n\s+II[^\d]{0,60}?(?:RD\$|US\$|\$)\s*([\d,.]+)/i);
  if(m){ result.sumSeccionII = parseMoneyInput(m[1]); result._matches.sumSeccionII = m[0]; }
  /* --- Vigencia (texto) --- */
  m = norm.match(/vigencia\s*:?\s*(.{10,150}?)(?=\s+mantenimiento|\s+prueba|\s+obra|$)/i);
  if(m) result.vigenciaText = m[1].trim().slice(0,150);
  return result;
}
/* Calcula prima total si tenemos neta+ISC pero falta total */
function fillMissingPremium(extracted){
  const rate = (state.config && state.config.iscRate) ? +state.config.iscRate : 16;
  if(extracted.premiumNet){
    extracted.premiumNet = Math.round(extracted.premiumNet);
    extracted.isc = Math.round(extracted.premiumNet * rate/100);
    extracted.premiumTotal = extracted.premiumNet + extracted.isc;
  } else if(extracted.premiumTotal){
    extracted.premiumTotal = Math.round(extracted.premiumTotal);
    extracted.premiumNet = Math.round(extracted.premiumTotal / (1 + rate/100));
    extracted.isc = extracted.premiumTotal - extracted.premiumNet;
  }
  return extracted;
}
/* ============================================================
   LECTOR QUE APRENDE POR ASEGURADORA
   Cada vez que se aplica una cotización, se guarda cómo llama esa
   aseguradora a cada campo (la etiqueta junto al número correcto).
   La próxima lectura de esa aseguradora usa esas etiquetas.
   ============================================================ */
const LEARN_FIELDS = [['premiumNet','Prima neta'],['isc','ISC'],['premiumTotal','Prima total'],['sumSeccionI','Suma Sec. I'],['sumSeccionII','Suma Sec. II']];
/* Lee un número escrito como 2,689,953.00 · 2.689.953,00 · 2689953 */
function parseAnyNumber(tok){
  let t = String(tok).trim();
  if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(t)) t = t.replace(/\./g, '').replace(',', '.');
  else t = t.replace(/,/g, '');
  const n = parseFloat(t); return isNaN(n) ? null : n;
}
/* Busca el número en el texto del PDF (aunque tenga centavos) y devuelve la etiqueta que lo precede en la misma línea */
function findLabelForValue(text, value){
  const target = Math.round(+value); if(!text || !target) return null;
  const re = /\d[\d.,]*\d|\d/g; let m;
  while((m = re.exec(text)) !== null){
    const n = parseAnyNumber(m[0]);
    if(n === null || Math.round(n) !== target) continue;
    const i = m.index;
    const lineStart = Math.max(text.lastIndexOf('\n', i), i - 70);
    let lab = text.slice(lineStart + 1, i)
      .replace(/(RD\$|US\$|USD|DOP|\$)\s*$/i, '').replace(/[:=\-–\s.]+$/, '')
      .replace(/^[^A-Za-zÁÉÍÓÚÑáéíóúñ]+/, '').replace(/\s+/g, ' ').trim();
    const words = lab.split(' '); if(words.length > 6) lab = words.slice(-6).join(' ');
    if(lab.length >= 3 && /[A-Za-zÁÉÍÓÚáéíóú]{3}/.test(lab)) return lab;
  }
  return null;
}
function learnedFor(insurerId){
  const al = ((state.config.extractAliases || {})[insurerId]) || {};
  const n = LEARN_FIELDS.reduce((a, [f]) => a + ((al[f] || []).length), 0);
  const lr = ((state.config.extractLearning || {})[insurerId]) || {};
  return { aliases: al, count: n, docs: lr.docs || 0, last: lr.last || '' };
}
/* Guarda lo aprendido de una cotización ya revisada por el usuario */
function learnFromReview(insurerId, text, finalVals, isNewDoc){
  if(!insurerId || !text) return 0;
  state.config.extractAliases = state.config.extractAliases || {};
  const al = state.config.extractAliases[insurerId] = state.config.extractAliases[insurerId] || {};
  let learned = 0;
  LEARN_FIELDS.forEach(([f]) => {
    const v = finalVals[f]; if(!(+v > 0)) return;
    const lab = findLabelForValue(text, v); if(!lab) return;
    al[f] = al[f] || [];
    const i = al[f].findIndex(x => x.toLowerCase() === lab.toLowerCase());
    if(i > 0) al[f].splice(i, 1);
    if(i !== 0){ al[f].unshift(lab); learned++; }
    al[f] = al[f].slice(0, 6);
  });
  state.config.extractLearning = state.config.extractLearning || {};
  const lr = state.config.extractLearning[insurerId] = state.config.extractLearning[insurerId] || { docs: 0 };
  if(isNewDoc !== false) lr.docs = (lr.docs || 0) + 1;
  lr.last = new Date().toISOString();
  save();
  return learned;
}
function forgetLearning(insurerId){
  if(state.config.extractAliases) delete state.config.extractAliases[insurerId];
  if(state.config.extractLearning) delete state.config.extractLearning[insurerId];
  save(); render(); syncToast('Se borró lo aprendido de esta aseguradora', true);
}
/* Une la lectura con IA con lo que el lector local y lo aprendido encuentran */
function mergeWithLocal(ex, text, insurerId){
  let local = null;
  try{ local = extractQuoteFields(text, insurerId); }catch(e){ return ex; }
  if(!local) return ex;
  ex._warnings = ex._warnings || []; ex._matches = ex._matches || {};
  LEARN_FIELDS.forEach(([f, lab]) => {
    const learned = local._matches && local._matches[f] === 'Plantilla aseguradora';
    if(learned && +local[f] > 0){
      if(+ex[f] > 0 && Math.round(+ex[f]) !== Math.round(+local[f])){
        ex._warnings.push(`ℹ ${lab}: la IA leyó ${Math.round(+ex[f]).toLocaleString('en-US')}; según lo aprendido de esta aseguradora es ${Math.round(+local[f]).toLocaleString('en-US')}. Se usó el aprendido.`);
      }
      ex[f] = +local[f]; ex._matches[f] = 'Aprendido de esta aseguradora';
    } else if(!(+ex[f] > 0) && +local[f] > 0){
      ex[f] = +local[f]; ex._matches[f] = local._matches[f] || 'Lector local';
    }
  });
  if(local.endorsement_sublimits && Object.keys(local.endorsement_sublimits).length){
    ex.endorsement_sublimits = { ...local.endorsement_sublimits, ...(ex.endorsement_sublimits || {}) };
  }
  if(!ex.clauses_rejected_text && local.clauses_rejected_text) ex.clauses_rejected_text = local.clauses_rejected_text;
  if(!ex.deductibles_proposed && local.deductibles_proposed) ex.deductibles_proposed = local.deductibles_proposed;
  return ex;
}
/* Trigger del input file por cada columna del comparador */
async function aiExtract(text, insurer, insurerId){
  const L = insurerId ? learnedFor(insurerId) : null;
  const hints = L && L.count ? { labels: L.aliases, note: 'Etiquetas que usa esta aseguradora para cada campo, aprendidas de cotizaciones anteriores revisadas.' } : undefined;
  const resp = await fetch('/api/extract', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ text:text, insurer:insurer||'', hints:hints }) });
  let data; try{ data = await resp.json(); }catch(e){ throw new Error('Respuesta inválida del servidor'); }
  if(!resp.ok) throw new Error(data && data.error ? data.error : ('HTTP '+resp.status));
  return data || {};
}
function aiToExtracted(ai){
  const r = { _matches:{}, _warnings:[], _sections:['IA'], _structured:true, _ai:true };
  ['premiumNet','isc','premiumTotal','sumSeccionI','sumSeccionII'].forEach(f => {
    if(ai[f]!=null && ai[f]!=='' && !isNaN(+ai[f])){ r[f] = +ai[f]; r._matches[f] = 'Leído con IA'; }
  });
  if(ai.deductibles && typeof ai.deductibles === 'object'){
    const d = ai.deductibles;
    r.deductibles3 = { cat: d.catastrophic || d.catastrofico || d.cat || '', otros: d.other || d.otros || '', rc: d.liability || d.rc || d.tpl || '' };
    r.deductibles_proposed = composeDeductibles(r.deductibles3);
  } else if(ai.deductibles) r.deductibles_proposed = String(ai.deductibles);
  if(Array.isArray(ai.clausesAccepted)){ r.clauses_accepted = ai.clausesAccepted; r.clauses_accepted_text = ai.clausesAccepted.join('\n'); }
  if(ai.currency) r._aiCurrency = ai.currency;
  return r;
}
function triggerPdfUpload(quoteIndex){
  const fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.accept = '.pdf,application/pdf';
  fileInput.style.display = 'none';
  document.body.appendChild(fileInput);
  fileInput.onchange = async (e) => {
    const file = e.target.files[0];
    document.body.removeChild(fileInput);
    if(!file) return;
    if(!window.pdfjsLib){ alert('PDF.js no cargó. Recarga la página.'); return; }
    try{
      showPdfLoadingModal(file.name);
      const text = await extractPdfText(file);
      const _insId = (activeCase().quotes[quoteIndex]||{}).insurerId;
      const _insName = ((typeof DEFAULT_INSURERS!=='undefined' && DEFAULT_INSURERS.find(i=>i.id===_insId))||{}).name || '';
      let extracted;
      try {
        const ai = await aiExtract(text, _insName, _insId);
        extracted = fillMissingPremium(mergeWithLocal(aiToExtracted(ai), text, _insId));
      } catch(e) {
        console.warn('IA no disponible, uso extractor local:', e);
        extracted = fillMissingPremium(extractQuoteFields(text, _insId));
      }
      if(text.replace(/\s+/g,'').length < 400) extracted._scanned = true;
      showPdfReviewModal(quoteIndex, extracted, text, file.name);
    }catch(err){
      console.error(err);
      alert('Error procesando el PDF: ' + err.message);
      closeModal();
    }
  };
  fileInput.click();
}

    ${fullText ? `

      <summary style="cursor:pointer;font-size:12px;color:var(--ink-500)">▸ Ver texto completo extraído del PDF (${fullText.length} caracteres)</summary>
      <pre style="background:var(--line-2);padding:10px;border-radius:6px;font-size:10px;max-height:240px;overflow:auto;white-space:pre-wrap;font-family:monospace;margin-top:6px">${escapeHtml(fullText.slice(0,8000))}${fullText.length>8000?'\n\n[...truncado a 8000 caracteres]':''}</pre>
    </details>` : ''}
    <div class="row" style="margin-top:18px;justify-content:flex-end;gap:8px">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="applyPdfExtraction(${quoteIndex}, window._pdfReview.ex)">${ex._reopen ? 'Guardar cambios' : 'Aplicar a cotización'}</button>
    </div>
  `;
  modal.classList.add('open');
}
/* Volver a abrir la revisión de una cotización (con o sin PDF leído) */
function reopenQuoteReview(qi){
  const c = activeCase(); const q = c && c.quotes[qi]; if(!q) return;
  const x = q.extraction || {};
  const ex = Object.assign({ _matches:{}, _warnings:[], _sections:[] }, JSON.parse(JSON.stringify(x.ex || {})));
  ex._reopen = true;
  ex._warnings = [];
  if(x.at){ try{ ex._fromDate = new Date(x.at).toLocaleDateString('es-DO', { day:'2-digit', month:'short', year:'numeric' }); }catch(e){} }
  ['premiumNet','isc','premiumTotal','sumSeccionI','sumSeccionII'].forEach(f => { ex[f] = +q[f] || ''; });
  ex.deductibles_proposed = q.deductibles_proposed || '';
  ex.deductibles3 = DED_KINDS.reduce((o, d) => { o[d.k] = quoteDeductible(q, d.k).v; return o; }, {});
  ex.clauses_accepted = (q.clauses_accepted || []).slice(); ex.clauses_accepted_text = ex.clauses_accepted.join('\n');
  ex.clauses_rejected = (q.clauses_rejected || []).slice(); ex.clauses_rejected_text = ex.clauses_rejected.join('\n');
  ex.endorsement_sublimits = Object.assign({}, q.endorsement_sublimits || {});
  showPdfReviewModal(qi, ex, x.text || '', x.filename || '');
}
function recalcPdfPrima(){
  const netEl = document.getElementById('pdfPremiumNet');
  if(!netEl) return;
  const net = parseFloat(String(netEl.value).replace(/,/g,'').replace(/[^0-9.\-]/g,''));
  if(isNaN(net)) return;
  const rate = (state.config && state.config.iscRate) ? +state.config.iscRate : 16;
  const isc = Math.round(net * rate/100);
  const iscEl = document.getElementById('pdfISC');
  const totEl = document.getElementById('pdfPremiumTotal');
  if(iscEl) iscEl.value = isc.toLocaleString('en-US');
  if(totEl) totEl.value = (net + isc).toLocaleString('en-US');
}
function applyPdfExtraction(quoteIndex, ex){
  const c = activeCase();
  const q = c.quotes[quoteIndex];
  if(!q){ closeModal(); return; }
  /* Aplicar campos numéricos solo si vienen detectados */
  const numFrom = (id, fb) => {
    const el = document.getElementById(id);
    if(!el) return fb;
    const n = parseFloat(String(el.value).replace(/,/g,'').replace(/[^0-9.\-]/g,''));
    return isNaN(n) ? undefined : Math.round(n);
  };
  const _pn = numFrom('pdfPremiumNet', ex.premiumNet);
  const _pi = numFrom('pdfISC', ex.isc);
  const _pt = numFrom('pdfPremiumTotal', ex.premiumTotal);
  if(_pn) q.premiumNet = _pn;
  if(_pi) q.isc = _pi;
  if(_pt) q.premiumTotal = _pt;
  /* Deducibles */
  if(document.getElementById('pdfDed_cat')){
    q.deductibles3 = {};
    DED_KINDS.forEach(d => { q.deductibles3[d.k] = (document.getElementById('pdfDed_' + d.k).value || '').trim(); });
    const composed = composeDeductibles(q.deductibles3);
    if(composed || !ex._reopen) q.deductibles_proposed = composed || ex.deductibles_proposed || '';
  } else if(ex.deductibles_proposed) q.deductibles_proposed = ex.deductibles_proposed;
  /* Aceptados (textarea editable) */
  const clEl = document.getElementById('pdfClauses');
  if(clEl){
    q.clauses_accepted = clEl.value.split('\n').map(s => s.trim()).filter(Boolean);
  } else if(ex.clauses_accepted_text){
    q.clauses_accepted = ex.clauses_accepted_text.split('\n').map(s => s.trim()).filter(Boolean);
  }
  /* Rechazados (textarea editable) */
  const rejEl = document.getElementById('pdfRejected');
  if(rejEl){
    q.clauses_rejected = rejEl.value.split('\n').map(s => s.trim()).filter(Boolean);
  } else if(ex.clauses_rejected_text){
    q.clauses_rejected = ex.clauses_rejected_text.split('\n').map(s => s.trim()).filter(Boolean);
  }
  /* Sub-límites por endoso — se guardan por cotización */
  if(ex.endorsement_sublimits && Object.keys(ex.endorsement_sublimits).length){
    q.endorsement_sublimits = { ...(q.endorsement_sublimits||{}), ...ex.endorsement_sublimits };
  }
  /* Sumas Sec. I / II detectadas → guardar como referencia en la cotización */
  const _s1 = numFrom('pdfSumI', ex.sumSeccionI);
  const _s2 = numFrom('pdfSumII', ex.sumSeccionII);
  if(_s1) q.sumSeccionI = _s1;
  if(_s2) q.sumSeccionII = _s2;
  /* Aprender de esta cotización revisada */
  let _learned = 0;
  try{
    const rv = window._pdfReview || {};
    _learned = learnFromReview(q.insurerId, rv.text, { premiumNet:_pn, isc:_pi, premiumTotal:_pt, sumSeccionI:_s1, sumSeccionII:_s2 }, !ex._reopen);
  }catch(e){ console.warn('No se pudo aprender de la cotización', e); }
  const sec = (ex._sections||[]).length;
  const warnCount = (ex._warnings||[]).length;
  if(!ex._reopen){
    q.notes = (q.notes ? q.notes + ' · ' : '') + `Importado PDF (${sec} secciones${warnCount?', '+warnCount+' warn':''})`;
    /* Guardar la lectura para poder volver a abrirla desde el Comparador */
    const rv = window._pdfReview || {};
    const keep = {}; ['_matches','_warnings','_sections','_structured','_ai','_scanned'].forEach(k => { if(ex[k] !== undefined) keep[k] = ex[k]; });
    q.extraction = { filename: rv.filename || '', at: new Date().toISOString(), text: String(rv.text || '').slice(0, 60000), ex: keep };
  }
  save();
  closeModal();
  render();
  if(_learned) syncToast('Cotización aplicada · el lector aprendió ' + _learned + ' etiqueta(s) nueva(s) de esta aseguradora', true);
}
/* ============================================================
   MODAL — selector de caso
   ============================================================ */
function openCasePicker(){
  const modal = document.getElementById('modal');
  const inner = document.getElementById('modalContent');
  inner.innerHTML = `
    <h3>Seleccionar caso</h3>
    <div style="max-height:50vh;overflow:auto;margin:-4px 0 16px">
      ${state.cases.map(c => `
        <div class="insurer-card" style="cursor:pointer" onclick="pickCase('${c.id}')">
          <div class="insurer-info">
            <div class="insurer-name">${escapeHtml(c.ref)} — ${escapeHtml(c.insured.name||'Sin asegurado')}</div>
            <div class="insurer-meta">${statusBadge(c.status)} · ${fmtDate(c.updatedAt)}</div>
          </div>
        </div>`).join('') || '<div class="empty">Sin casos</div>'}
    </div>
    <div class="row">
      <button class="btn btn-ghost" onclick="closeModal()">Cerrar</button>
      <button class="btn btn-gold right" onclick="closeModal();newCase()">+ Nuevo caso</button>
    </div>
  `;
  modal.classList.add('open');
}
function pickCase(id){ state.activeCaseId=id; save(); closeModal(); render(); }
function closeModal(){ document.getElementById('modal').classList.remove('open'); }
/* ============================================================
   NAV LISTENER + BOOTSTRAP
   ============================================================ */
document.querySelectorAll('.nav-item').forEach(n => {
  n.addEventListener('click', () => { state.view = n.dataset.view; save(); render(); });
});
document.getElementById('modal').addEventListener('click', e => { if(e.target.id==='modal') closeModal(); });
/* ===== Listeners globales para campos de dinero =====
   focus → desformatea (quita comas) para edición cómoda
   blur  → re-formatea con comas (separador de miles)
   La función onchange asociada al input se encarga de guardar el valor raw */
document.addEventListener('focus', e => {
  if(e.target && e.target.classList && e.target.classList.contains('money-input')){
    e.target.value = (e.target.value || '').replace(/,/g,'');
    /* Seleccionar todo para que el usuario pueda sobrescribir fácil */
    setTimeout(() => { try{ e.target.select(); }catch(_){} }, 0);
  }
}, true);
document.addEventListener('blur', e => {
  if(e.target && e.target.classList && e.target.classList.contains('money-input')){
    const n = parseMoneyInput(e.target.value);
    e.target.value = n > 0 ? n.toLocaleString('en-US') : '';
  }
}, true);
// Asignar logo embebido del sidebar (no se puede usar template literal en HTML estático)
const sidebarLogoEl = document.getElementById('sidebarLogo');
if(sidebarLogoEl) sidebarLogoEl.src = LOGO_SIDEBAR_PNG;
/* ============================================================
   PRODUCCIÓN — Supabase: login + datos compartidos
   ============================================================ */
function _errTxt(e){ return (e && (e.message || e.hint || e.details)) || (typeof e==='string'?e:JSON.stringify(e)); }
function syncToast(msg, ok){
  let t=document.getElementById('syncToast');
  if(!t){ t=document.createElement('div'); t.id='syncToast'; t.style.cssText='position:fixed;bottom:14px;right:14px;z-index:950;padding:10px 14px;border-radius:10px;font-family:Inter,system-ui,sans-serif;font-size:12.5px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.4);max-width:360px;line-height:1.4'; document.body.appendChild(t); }
  t.style.background = ok ? '#ECFDF3' : '#FEF2F2';
  t.style.color = ok ? '#166534' : '#9F1D24';
  t.style.border = '1px solid '+(ok?'#9AD9B1':'#F3B4B7');
  t.textContent = msg; t.style.display='block';
  clearTimeout(t._h); t._h=setTimeout(function(){ t.style.display='none'; }, ok?1500:8000);
}
async function remoteSaveNow(){
  if(!sbClient || !currentUser) return;
  try{
    const r1 = await sbClient.from('app_config').upsert({ id:1, data: state.config, updated_by: currentUser.id, updated_at: new Date().toISOString() });
    if(r1.error) throw r1.error;
    const c = state.cases.find(x=>x.id===state.activeCaseId);
    if(c){
      const r2 = await sbClient.from('cases').upsert({ id:c.id, ref:c.ref||'', status:c.status||'', data:c, updated_by: currentUser.id, updated_at:new Date().toISOString() });
      if(r2.error) throw r2.error;
    }
    syncToast('Guardado en la nube \u2713', true);
  }catch(e){ console.error('Guardado remoto falló:', e); syncToast('\u26A0 No guardó en la nube: '+_errTxt(e), false); }
}
function scheduleRemoteSave(){
  if(!sbClient || !currentUser) return;
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(remoteSaveNow, 800);
}
function mapCarteraRow(r){
  return { cliente:r.cliente, bien:r.bien, poliza:r.poliza, aseguradora:r.aseguradora, moneda:r.moneda,
    vigStart:r.vig_start, vigEnd:r.vig_end, valor:+r.valor||0, primaNetaAnual:+r.prima_neta_anual||0,
    primaBrutaAnual:+r.prima_bruta_anual||0, lat:+r.lat, lng:+r.lng,
    provincia:r.provincia, geo:r.geo, source:'excel' };
}
async function loadRemote(){
  try{
    const [caseRes, cfgRes, cartRes] = await Promise.all([
      sbClient.from('cases').select('data').order('updated_at',{ascending:false}),
      sbClient.from('app_config').select('data').eq('id',1).maybeSingle(),
      sbClient.from('cartera_trc').select('*')
    ]);
    if(caseRes.error) throw caseRes.error;
    if(cartRes.error) throw cartRes.error;
    state.cases = (caseRes.data||[]).map(x=>migrateCase(x.data));
    if(cfgRes && cfgRes.data && cfgRes.data.data) state.config = migrateConfig({ ...state.config, ...cfgRes.data.data });
    if(Array.isArray(cartRes.data)) CARTERA_DB = cartRes.data.map(mapCarteraRow);
    state.activeCaseId = (state.cases[0] && state.cases[0].id) || null;
    syncToast('Datos cargados de la nube \u2713', true);
  }catch(e){
    console.error('Carga remota falló:', e);
    syncToast('\u26A0 No cargó de la nube: '+_errTxt(e)+' — ¿corriste schema.sql y cartera_seed.sql?', false);
    load();
  }
}
function requireLogin(){
  return new Promise(async (resolve)=>{
    try{
      const { data:{ session } } = await sbClient.auth.getSession();
      if(session && session.user){ currentUser = session.user; addLogoutButton(); return resolve(); }
    }catch(e){}
    showLoginOverlay(resolve);
  });
}
function showLoginOverlay(resolve){
  const ov = document.createElement('div');
  ov.id = 'loginOverlay';
  ov.style.cssText = 'position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#012A4F,#001428);font-family:Inter,system-ui,sans-serif';
  ov.innerHTML =
    '<form id="loginForm" style="background:#FFFDF8;border:1px solid #E6DDCD;border-radius:16px;padding:32px 30px;width:340px;box-shadow:0 24px 60px rgba(0,0,0,.35)">'+
      '<img id="loginLogo" alt="Garrigó" style="height:42px;display:block;margin:0 auto 18px">'+
      '<div style="text-align:center;color:#0E2A47;font-weight:700;font-size:17px;margin-bottom:4px;font-family:Montserrat,Inter,sans-serif">Generador TRC</div>'+
      '<div style="text-align:center;color:#69788B;font-size:12px;margin-bottom:20px">Acceso del equipo</div>'+
      '<label style="color:#3B4B60;font-size:12px;font-weight:600">Correo</label>'+
      '<input id="loginEmail" type="email" autocomplete="username" required style="width:100%;margin:6px 0 14px;padding:11px 12px;border-radius:10px;border:1px solid #D3DBE5;background:#ffffff;color:#14243A;font-size:14px;box-sizing:border-box">'+
      '<label style="color:#3B4B60;font-size:12px;font-weight:600">Contraseña</label>'+
      '<input id="loginPass" type="password" autocomplete="current-password" required style="width:100%;margin:6px 0 6px;padding:11px 12px;border-radius:10px;border:1px solid #D3DBE5;background:#ffffff;color:#14243A;font-size:14px;box-sizing:border-box">'+
      '<div id="loginMsg" style="color:#B42318;font-size:12px;min-height:16px;margin:6px 0"></div>'+
      '<button type="submit" id="loginBtn" style="width:100%;margin-top:8px;padding:12px;border:none;border-radius:10px;background:#FF5200;color:#fff;font-weight:700;font-size:14px;cursor:pointer">Entrar</button>'+
    '</form>';
  document.body.appendChild(ov);
  try{ if(typeof LOGO_DOC_PNG!=='undefined') document.getElementById('loginLogo').src = LOGO_DOC_PNG; }catch(e){}
  document.getElementById('loginForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPass').value;
    const msg = document.getElementById('loginMsg');
    const btn = document.getElementById('loginBtn');
    msg.style.color='#8B9BAC'; msg.textContent='Entrando…'; btn.disabled=true;
    try{
      const { data, error } = await sbClient.auth.signInWithPassword({ email, password });
      if(error){ msg.style.color='#B42318'; msg.textContent='Correo o contraseña incorrectos.'; btn.disabled=false; return; }
      currentUser = data.user; ov.remove(); addLogoutButton(); resolve();
    }catch(err){ msg.style.color='#B42318'; msg.textContent='No se pudo conectar. Revisa tu internet.'; btn.disabled=false; }
  });
}
function addLogoutButton(){
  if(document.getElementById('logoutBtn')) return;
  const b=document.createElement('button');
  b.id='logoutBtn'; b.textContent='Cerrar sesión';
  b.style.cssText='position:fixed;bottom:14px;left:14px;z-index:900;background:#ffffff;color:#3B4B60;border:1px solid #DDE4EC;box-shadow:0 2px 8px rgba(14,42,71,.10);border-radius:8px;padding:7px 12px;font-size:12px;cursor:pointer;font-family:Inter,sans-serif';
  b.onclick=async()=>{ try{ await sbClient.auth.signOut(); }catch(e){} location.reload(); };
  document.body.appendChild(b);
}
/* MODO LOCAL: al abrir el archivo en la PC (file://) o en localhost se salta el login
   y se trabaja con datos guardados en el navegador. En Vercel el login sigue igual. */
const LOCAL_DEV = location.protocol === 'file:' || ['localhost','127.0.0.1'].includes(location.hostname);
function addLocalBadge(){
  const b=document.createElement('div');
  b.textContent='MODO LOCAL · sin login · datos solo en este navegador';
  b.style.cssText='position:fixed;bottom:14px;left:14px;z-index:900;background:#FF5200;color:#fff;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;font-family:Inter,system-ui,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.25)';
  document.body.appendChild(b);
}
async function boot(){
  if(LOCAL_DEV){ load(); render(); addLocalBadge(); return; }
  if(!window.supabase || !sbClient){ console.error('Supabase no cargó'); load(); render(); return; }
  await requireLogin();
  await loadRemote();
  render();
}
boot();
</script>
