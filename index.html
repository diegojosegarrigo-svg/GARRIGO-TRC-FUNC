<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Garrigo Seguros — Generador TRC / TRM</title>
<!-- Tipografías -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@600;700;800;900&family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
<!-- Favicon Garrigo -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23004A88'/%3E%3Ctext x='32' y='34' font-family='Arial Black,sans-serif' font-weight='900' font-size='26' text-anchor='middle' fill='white'%3EG%3C/text%3E%3Crect x='14' y='40' width='36' height='2.5' fill='%23FF5200'/%3E%3Ctext x='32' y='56' font-family='Arial,sans-serif' font-weight='700' font-size='9' text-anchor='middle' fill='%23939598'%3ESEG%3C/text%3E%3C/svg%3E">
<!-- Librerías para exportar a DOCX y PDF -->
<!-- html-docx-js NO está en cdnjs; usamos jsDelivr con fallback a unpkg -->
<script src="https://cdn.jsdelivr.net/npm/html-docx-js@0.3.1/dist/html-docx.js"
        onerror="(function(){var s=document.createElement('script');s.src='https://unpkg.com/html-docx-js@0.3.1/dist/html-docx.js';document.head.appendChild(s);})()"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<!-- PDF.js para extracción de texto desde PDFs de cotización -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  if(window.pdfjsLib){
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
</script>
<style>
:root{
  /* Tema claro Garrigó: fondo crema con azul marino profundo; naranja solo como acento.
     Marca: azul #004A88 · naranja #FF5200 · gris #918F8F */
  --grg-blue:#004A88;        /* Azul primario */
  --grg-blue-dk:#00335E;     /* Azul oscuro */
  --grg-blue-2:#0A5AA0;      /* Azul medio */
  --grg-blue-lt:#B9D0E8;     /* Borde azul suave */
  --grg-blue-bg:#EAF0F6;     /* Fondo azul muy claro */
  --grg-orange:#FF5200;      /* Naranja acento */
  --grg-orange-2:#FF6B2C;    /* Naranja hover */
  --grg-orange-lt:#FFF1E6;   /* Fondo naranja muy claro */
  --grg-gray:#918F8F;        /* Gris corporativo */
  --grg-gray-lt:#C7C9CC;
  --grg-dark:#231F20;
  /* Aliases usados por el resto del CSS */
  --navy-900:#0A1E35;
  --navy-800:#00335E;
  --navy-700:#00335E;
  --navy-600:#004A88;
  --navy-500:#2F6DB0;
  --navy-300:#9DBBDB;
  --gold-500:var(--grg-orange);
  --gold-400:#FF8A55;
  --gold-300:#FFB89A;
  --gold-100:#FFF3EC;
  --ink-900:#1A2433;
  --ink-700:#46505E;
  --ink-500:#7A7F86;
  --ink-300:#AFAEA8;
  --line:#E4D9C6;
  --line-2:#EFE6D6;
  --bg:#F2EADB;
  --white:#FDF8EF;
  --surface:#FDF8EF;
  --surface-2:#F8F1E5;
  --num:#00335E;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#C0262D;
  --shadow-sm:0 1px 2px rgba(40,30,15,.05),0 1px 3px rgba(40,30,15,.04);
  --shadow:0 6px 20px rgba(40,30,15,.08);
  --shadow-lg:0 24px 60px rgba(40,30,15,.20);
  --radius:12px;
  --radius-lg:14px;
  --font-display:"Montserrat","Inter",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  font-size:14px;
  color:var(--ink-900);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
}
/* ===== LAYOUT ===== */
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{
  background:linear-gradient(180deg,#012A4F 0%,#001A33 100%);
  color:#fff;border-right:1px solid rgba(0,0,0,.08);
  padding:24px 0;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{padding:0 22px 24px;border-bottom:1px solid rgba(255,255,255,.10);margin-bottom:18px}
/* Logo SVG Garrigo Seguros - estilizable por color */
.garrigo-logo{display:block;width:100%;max-width:240px;height:auto;overflow:visible}
.garrigo-logo .lg-garrigo{font-family:"Montserrat","Inter","Arial Black",Impact,sans-serif;font-weight:900;font-size:36px;letter-spacing:-1px}
.garrigo-logo .lg-seguros{font-family:"Montserrat","Inter","Arial Black",Impact,sans-serif;font-weight:900;font-size:36px;letter-spacing:-0.5px}
.garrigo-logo .lg-tag{font-family:"Montserrat","Inter",Arial,sans-serif;font-weight:600;font-size:7px;letter-spacing:3px}
.garrigo-logo .lg-line{stroke:var(--grg-orange);stroke-width:2.2}
/* ===== Logos PNG embebidos (reemplazan SVG con texto) ===== */
.garrigo-logo-img{display:block;height:auto;max-width:100%;image-rendering:-webkit-optimize-contrast}
.garrigo-logo-img.on-white{filter:none}
.garrigo-logo-img.on-blue{filter:none}
/* ===== Modo de exportación a PDF =====
   Se aplica .exporting-pdf al .doc justo antes de capturar; los estilos
   neutralizan el shadow/margen y ajustan el ancho al de A4 para que
   html2pdf escale 1:1 sin recortar contenido.
   Las tablas y celdas reciben wrap forzado para evitar overflow horizontal. */
.doc.exporting-pdf{
  box-shadow:none !important;
  margin:0 !important;
  max-width:none !important;
  width:740px !important;            /* A4 portrait útil con 10mm de margen ≈ 740px @ 96dpi */
  padding:30px 40px !important;       /* margen visual interno */
  overflow:hidden !important;
}
.doc.exporting-pdf *{box-sizing:border-box}
.doc.exporting-pdf img{max-width:100%;height:auto}
.doc.exporting-pdf table{width:100% !important;max-width:100% !important;table-layout:fixed;word-wrap:break-word;overflow-wrap:break-word;page-break-inside:auto}
.doc.exporting-pdf table tr{page-break-inside:avoid}
.doc.exporting-pdf table td,.doc.exporting-pdf table th{word-wrap:break-word;overflow-wrap:anywhere;word-break:break-word}
.doc.exporting-pdf .bilingual{display:grid !important;grid-template-columns:minmax(0,1fr) minmax(0,1fr) !important;gap:14px;width:100%}
.doc.exporting-pdf .bilingual > div{min-width:0;overflow:hidden;word-wrap:break-word;overflow-wrap:break-word}
.doc.exporting-pdf .kv{display:grid !important;grid-template-columns:90px minmax(0,1fr) !important;gap:3px 8px;width:100%}
.doc.exporting-pdf .kv dt,.doc.exporting-pdf .kv dd{min-width:0;word-wrap:break-word;overflow-wrap:break-word}
.doc.exporting-pdf .cl-table{table-layout:fixed}
.doc.exporting-pdf .cl-label{width:130px;word-wrap:break-word}
.doc.exporting-pdf p,.doc.exporting-pdf li{page-break-inside:avoid;word-wrap:break-word;overflow-wrap:break-word}
.doc.exporting-pdf h2,.doc.exporting-pdf h3{page-break-after:avoid}
.doc.exporting-pdf .doc-footer{page-break-inside:avoid;page-break-before:auto}
.doc.exporting-pdf .garrigo-logo-img{width:180px !important;max-width:180px}
/* Variante para sidebar (fondo azul) */
.garrigo-logo.on-blue .lg-garrigo{fill:#fff}
.garrigo-logo.on-blue .lg-seguros{fill:rgba(255,255,255,.85)}
.garrigo-logo.on-blue .lg-tag{fill:rgba(255,255,255,.65)}
/* Variante para fondo claro (documentos) */
.garrigo-logo.on-white .lg-garrigo{fill:var(--grg-blue)}
.garrigo-logo.on-white .lg-seguros{fill:var(--grg-gray)}
.garrigo-logo.on-white .lg-tag{fill:var(--grg-gray)}
.brand-sub{
  font-family:"Inter",sans-serif;font-size:10px;letter-spacing:1.5px;
  color:rgba(255,255,255,.55);margin-top:10px;text-transform:uppercase;font-weight:600;
}
.nav{padding:0 12px;display:flex;flex-direction:column;gap:2px}
.nav-section{
  font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;font-weight:600;
  color:rgba(255,255,255,.45);padding:16px 12px 6px;
}
.nav-item{
  display:flex;align-items:center;gap:12px;
  padding:10px 12px;border-radius:10px;cursor:pointer;
  color:rgba(255,255,255,.80);font-weight:500;font-size:13.5px;
  transition:background .15s,color .15s;
}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{
  background:rgba(255,255,255,.11);
  color:#fff;font-weight:600;
  box-shadow:inset 3px 0 0 var(--grg-orange);
}
.nav-item.active .nav-ico{color:var(--grg-orange);opacity:1}
.nav-ico{
  width:18px;height:18px;display:inline-grid;place-items:center;opacity:.85;
}
.main{display:flex;flex-direction:column;min-width:0}
.topbar{
  background:rgba(253,248,239,.95);backdrop-filter:saturate(1.2) blur(8px);border-bottom:1px solid var(--line);
  padding:14px 28px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:10;
}
.topbar-left{display:flex;flex-direction:column;gap:2px}
.topbar h1{margin:0;font-family:var(--font-display);font-size:19px;font-weight:700;color:var(--navy-900);letter-spacing:-.2px}
.topbar-sub{font-size:12px;color:var(--ink-500)}
.topbar-right{display:flex;align-items:center;gap:10px}
.case-pill{
  display:inline-flex;align-items:center;gap:8px;
  padding:6px 12px;background:#EDE6D9;color:#00335E;border:1px solid #E0D5C3;
  border-radius:999px;font-size:12px;font-weight:600;
}
.case-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--gold-500)}
.content{padding:28px;flex:1;max-width:1400px;width:100%;margin:0 auto}
/* ===== BOTONES ===== */
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:9px 16px;border-radius:10px;border:1px solid transparent;
  font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;
  transition:all .15s;text-decoration:none;line-height:1;
}
.btn-primary{background:#00335E;color:#fff}
.btn-primary:hover{background:#00223F;box-shadow:0 4px 14px rgba(0,35,63,.28)}
.btn-gold{background:var(--grg-orange);color:#fff}
.btn-gold:hover{background:#E84A00;box-shadow:0 4px 14px rgba(255,82,0,.28)}
.btn-ghost{background:var(--surface);color:#00335E;border-color:var(--line)}
.btn-ghost:hover{background:#F3EDE2;border-color:#DCCFBA}
.btn:focus-visible,.nav-item:focus-visible,.tab:focus-visible{outline:2px solid var(--grg-blue);outline-offset:2px}
.btn-sm{padding:6px 10px;font-size:12px}
.btn-icon{padding:8px;width:34px;height:34px;justify-content:center}
.btn-danger{background:#FDECEC;color:#A11D24;border-color:#F6CACC}
.btn-danger:hover{background:#FADADB}
/* ===== CARDS ===== */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:24px;box-shadow:var(--shadow-sm);margin-bottom:20px;
}
.card-header{
  display:flex;justify-content:space-between;align-items:flex-start;
  margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--line-2);
}
.card-title{font-family:var(--font-display);font-size:15.5px;font-weight:700;color:var(--navy-900);margin:0;letter-spacing:-.1px}
.card-subtitle{font-size:12px;color:var(--ink-500);margin-top:4px}
/* ===== FORMULARIOS ===== */
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 18px}
.form-grid.cols-3{grid-template-columns:repeat(3,1fr)}
.form-grid.cols-4{grid-template-columns:repeat(4,1fr)}
.full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;color:var(--ink-700);letter-spacing:.2px}
.field .hint{font-size:11px;color:var(--ink-500);margin-top:2px}
.input,.select,.textarea{
  font-family:inherit;font-size:13px;color:var(--ink-900);
  padding:10px 12px;border:1px solid #DDD2C0;border-radius:10px;
  background:var(--surface);outline:none;transition:all .15s;width:100%;
}
.input:focus,.select:focus,.textarea:focus{
  border-color:#2F5F8F;box-shadow:0 0 0 3px rgba(0,51,94,.14);
}
.textarea{resize:vertical;min-height:80px;line-height:1.5}
.input[type="number"]{font-variant-numeric:tabular-nums}
/* Campos de dinero: alineación a la derecha, números tabulares, fondo sutil */
.money-input{
  text-align:right;
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum";
  letter-spacing:.2px;
}
.money-input:not(:placeholder-shown){
  font-weight:600;
  color:var(--num);
}
.money-input:focus{
  text-align:left;
  font-weight:500;
  color:var(--ink-900);
}
.check-row{display:flex;align-items:center;gap:10px;padding:6px 0}
.check-row input[type="checkbox"]{
  width:16px;height:16px;accent-color:var(--navy-700);
}
/* ===== TABS / WIZARD ===== */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto;padding-bottom:1px}
.tab{
  padding:10px 14px;font-size:13px;font-weight:600;color:var(--ink-500);
  cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;
}
.tab:hover{color:var(--navy-700)}
.tab.active{color:var(--navy-900);border-bottom-color:var(--gold-500)}
.tab-count{
  display:inline-block;background:var(--line-2);color:var(--ink-700);
  padding:1px 7px;border-radius:999px;font-size:10px;margin-left:6px;font-weight:700;
}
.wizard-steps{
  display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;
}
.wizard-step{
  display:flex;align-items:center;gap:8px;padding:9px 14px;
  background:var(--surface);border:1px solid var(--line);border-radius:999px;
  font-size:12px;font-weight:600;color:var(--ink-500);cursor:pointer;
  transition:all .15s;
}
.wizard-step:hover{border-color:var(--navy-300);color:var(--navy-700)}
.wizard-step.active{background:var(--navy-700);border-color:var(--navy-700);color:#fff}
.wizard-step.done{border-color:var(--gold-400);color:var(--navy-800)}
.wizard-step-n{
  display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;
  background:var(--line-2);color:var(--ink-700);font-size:11px;font-weight:700;
}
.wizard-step.active .wizard-step-n{background:var(--gold-500);color:var(--navy-900)}
.wizard-step.done .wizard-step-n{background:var(--gold-400);color:var(--navy-900)}
/* ===== TABLAS ===== */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line-2);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-500);font-weight:700;background:#F6F0E5}
tr:hover td{background:#FBF6EE}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
/* ===== BADGES & STATUS ===== */
.badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;
}
.badge-cot{background:#fef3c7;color:#854d0e}
.badge-comp{background:#dbeafe;color:#1e40af}
.badge-coloc{background:#dcfce7;color:#166534}
.badge-emit{background:#e0e7ff;color:#3730a3}
.badge-ren{background:#fce7f3;color:#9d174d}
/* ===== DASHBOARD ===== */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.kpi-row.kpi-row-3{grid-template-columns:repeat(3,1fr)}
.kpi{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow-sm);border-top:3px solid var(--grg-blue);
}
.kpi.kpi-alert{border-top-color:var(--grg-orange)}
.kpi{border-top-color:#00335E}
.kpi-label{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-500);font-weight:600}
.kpi-value{font-family:var(--font-display);font-size:24px;font-weight:700;color:var(--navy-900);margin-top:6px;font-variant-numeric:tabular-nums}
.kpi-sub{font-size:12px;color:var(--ink-500);margin-top:4px}
/* ===== CLAUSE LIBRARY ===== */
.clause{
  border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;
  background:var(--surface);transition:all .15s;
}
.clause.selected{border-color:#FFC7A8;background:#FFF8F4;box-shadow:inset 3px 0 0 var(--grg-orange)}
.clause-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.clause-code{
  font-family:"Source Serif 4",Georgia,serif;font-weight:600;color:var(--navy-800);
  font-size:13px;letter-spacing:.3px;
}
.clause-title{font-weight:600;font-size:13px;color:var(--ink-900)}
.clause-body{margin-top:10px;display:none}
.clause.open .clause-body{display:block}
.clause-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
.clause-cols .field label{font-size:10px;color:var(--ink-500);text-transform:uppercase;letter-spacing:.5px}
/* ===== INSURER PANEL ===== */
.insurer-card{
  display:flex;align-items:center;gap:14px;padding:12px 14px;
  border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:8px;
  transition:all .15s;
}
.insurer-card.selected{border-color:#C9D6E3;background:#F3F5F6;box-shadow:inset 3px 0 0 #00335E}
.insurer-mark{
  width:42px;height:42px;border-radius:10px;display:grid;place-items:center;
  font-weight:700;color:#fff;font-size:13px;flex-shrink:0;
}
.insurer-info{flex:1;min-width:0}
.insurer-name{font-weight:600;color:var(--navy-900)}
.insurer-meta{font-size:11px;color:var(--ink-500);margin-top:2px}
.insurer-fields{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:2;margin-left:auto}
/* ===== COMPARADOR ===== */
.compare-grid{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.compare-grid table{min-width:900px}
.compare-grid th:first-child,.compare-grid td:first-child{
  position:sticky;left:0;background:var(--surface);border-right:1px solid var(--line);font-weight:600;color:var(--navy-800);
}
.compare-grid th:first-child{background:var(--line-2)}
.best{background:#E9F7EF !important;color:#166534;font-weight:700}
.worst{background:#FDEEEE !important;color:#A11D24}
.cmp-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,1.6fr);gap:12px;margin:0 0 18px}
.cmp-stat,.cmp-rec{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.cmp-rec{background:#0A1E35;border-color:#0A1E35;color:#E8EEF5;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.cmp-rec .cmp-stat-k{color:#FFB89A}
.cmp-rec .btn-ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.cmp-rec .btn-primary{background:var(--grg-orange)}
.cmp-stat-k{font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--ink-500)}
.cmp-stat-v{font-family:var(--font-display);font-size:16px;font-weight:700;color:var(--navy-900);margin-top:4px;line-height:1.25}
.cmp-stat-s{font-size:12px;color:var(--ink-500);margin-top:3px}
.cmp-rec-t{font-size:13px;line-height:1.5}
.cmp-rec-t strong{color:#fff}
.compare-grid tr.cmp-group td{background:var(--line-2);font-family:var(--font-display);font-size:12px;font-weight:700;color:var(--navy-900);letter-spacing:.2px;padding:8px 12px;border-right:none}
.compare-grid tr.cmp-group td span{font-family:Inter,sans-serif;font-weight:500;color:var(--ink-500);margin-left:10px;font-size:11px}
.cmp-sub{font-size:11px;color:var(--ink-500);font-weight:400;margin-top:2px}
.cmp-c{text-align:center}
.cmp-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:999px;padding:4px 10px;font:600 12px Inter,sans-serif;cursor:pointer}
.cmp-chip span{font-weight:500;font-size:11px}
.cmp-ok{background:#E9F7EF;color:#166534;border-color:#BFE3CC}
.cmp-mod{background:#FFF6E5;color:#92400E;border-color:#F3D9A6}
.cmp-bad{background:#FDEEEE;color:#A11D24;border-color:#F3C3C6}
.cmp-unk{background:var(--surface-2);color:var(--ink-500);border-color:var(--line)}
.cmp-chip:hover{filter:brightness(.97)}
.cmp-chip:focus-visible{outline:2px solid var(--navy-800);outline-offset:2px}
.cmp-tag{display:inline-block;background:#FDEEEE;color:#A11D24;border-radius:6px;padding:2px 7px;font-size:11px;font-weight:700;margin:2px 2px 0 0}
.cmp-okline{color:#166534;font-size:12px;font-weight:600}
.cmp-diff{font-size:12px;font-weight:600;color:var(--ink-700);text-align:right;font-variant-numeric:tabular-nums}
.cmp-diff span{color:var(--ink-500);font-weight:500}
.cmp-diff-best{color:#166534}
.cmp-score-pill{margin-left:auto;background:#0A1E35;color:#fff;border-radius:999px;padding:3px 9px;font:700 11px Inter,sans-serif;font-variant-numeric:tabular-nums}
.cmp-break{font-size:10.5px;color:var(--ink-500);text-align:center;margin-top:4px}
.cmp-more{margin-top:14px}
.cmp-file{font-size:10.5px;font-weight:500;color:var(--ink-500);text-transform:none;letter-spacing:0;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmp-guess{font-style:italic;color:var(--ink-700)}
.cmp-more summary{cursor:pointer;font-weight:600;color:var(--navy-800);font-size:13px}
.cmp-weights{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line-2);font-size:12px;color:var(--ink-700)}
.cmp-weights > span:first-child{font-weight:700;color:var(--navy-900)}
.cmp-weights label{display:inline-flex;align-items:center;gap:6px}
.cmp-weights .input{width:64px;padding:6px 8px;text-align:right}
@media (max-width:1100px){.cmp-summary{grid-template-columns:1fr 1fr}}
/* ===== PREVIEW ===== */
.preview-wrap{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);
  box-shadow:var(--shadow);overflow:hidden;
}
.preview-toolbar{
  background:linear-gradient(180deg,var(--surface),var(--surface-2));
  border-bottom:1px solid var(--line);padding:12px 18px;
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
}
.preview-body{padding:32px;max-height:75vh;overflow:auto;background:var(--surface-2)}
.doc{
  --ink-900:#101724;--ink-700:#374151;--ink-500:#6b7280;--ink-300:#9ca3af;--line:#e5e7eb;--line-2:#f1f3f6;--surface:#ffffff;--white:#ffffff;--grg-blue-bg:#EAF1F9;--grg-orange-lt:#FFE9E0;
  background:var(--surface);max-width:870px;margin:0 auto;padding:50px 60px;
  font-family:"Source Serif 4",Georgia,serif;font-size:11.5pt;line-height:1.55;color:#1a1f2e;
  box-shadow:0 6px 30px rgba(10,31,61,.12);
}
.doc h1,.doc h2,.doc h3{font-family:"Inter",sans-serif;color:var(--grg-blue)}
.doc h1{font-size:18pt;margin:0 0 6px;letter-spacing:.3px}
.doc h2{font-size:13pt;margin:24px 0 10px;border-bottom:2px solid var(--grg-orange);padding-bottom:4px;color:var(--grg-blue)}
.doc h3{font-size:11.5pt;margin:18px 0 8px;color:var(--grg-blue-2)}
.doc-header{
  display:flex;justify-content:space-between;align-items:center;gap:20px;
  padding-bottom:18px;border-bottom:2px solid var(--grg-blue);margin-bottom:24px;
  position:relative;
}
.doc-header::after{
  content:"";position:absolute;left:0;right:0;bottom:-5px;height:3px;background:var(--grg-orange);
}
.doc-brand{display:flex;align-items:center;overflow:visible}
.doc-brand .garrigo-logo{width:240px;max-width:240px;overflow:visible}
.doc-brand-tagline{
  font-family:"Inter",sans-serif;font-size:8.5pt;color:var(--grg-gray);
  margin-top:4px;text-align:right;
}
.doc-ref{font-family:"Inter";font-size:9pt;color:var(--ink-700);text-align:right;line-height:1.6}
.doc-ref-num{font-size:13pt;font-weight:700;color:var(--grg-blue);letter-spacing:.5px}
.doc-ref-type{
  display:inline-block;background:var(--grg-orange);color:#fff;font-weight:700;
  font-size:8pt;letter-spacing:1.5px;padding:3px 10px;border-radius:3px;margin-bottom:6px;text-transform:uppercase;
}
.doc-footer{
  margin-top:40px;padding-top:14px;border-top:1px solid var(--line);
  font-family:"Inter";font-size:8.5pt;color:var(--ink-500);text-align:center;line-height:1.5;
  position:relative;
}
.doc-footer::before{
  content:"";position:absolute;top:-1px;left:50%;transform:translateX(-50%);
  width:60px;height:3px;background:var(--grg-orange);
}
.bilingual{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.bilingual .col-label{
  font-family:"Inter";font-size:8.5pt;font-weight:700;
  text-transform:uppercase;letter-spacing:1px;color:var(--grg-orange);
  margin-bottom:6px;
}
.doc table{font-family:"Inter";font-size:9.5pt;margin:8px 0}
.doc table th{background:var(--grg-blue);color:#fff;font-weight:600;font-size:9pt;padding:8px 10px;text-transform:none;letter-spacing:0}
.doc table td{border-bottom:1px solid #e8ebef;padding:8px 10px}
.doc-section-num{
  font-family:"Montserrat","Inter",sans-serif;font-weight:800;color:var(--grg-orange);
  font-size:11pt;display:inline-block;margin-right:8px;
}
.kv{display:grid;grid-template-columns:200px 1fr;gap:6px 16px;font-family:"Inter";font-size:10pt}
.kv dt{font-weight:600;color:var(--ink-700)}
.kv dd{margin:0;color:var(--ink-900)}
/* ===== EMAIL GENERATOR ===== */
.email-card{
  border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;background:var(--surface);
}
.email-meta{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;align-items:end}
/* ===== MODAL ===== */
.modal-bg{
  position:fixed;inset:0;background:rgba(14,42,71,.45);
  display:none;align-items:center;justify-content:center;z-index:100;
  backdrop-filter:blur(4px);
}
.modal-bg.open{display:flex}
.modal{
  background:var(--surface);border-radius:16px;padding:28px;min-width:480px;max-width:90vw;
  max-height:85vh;overflow:auto;box-shadow:var(--shadow-lg);
}
.modal h3{margin:0 0 16px;color:var(--navy-900)}
/* ===== UTILITIES ===== */
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.right{margin-left:auto}
.muted{color:var(--ink-500)}
.center{text-align:center}
.sep{height:1px;background:var(--line);margin:18px 0}
.section-title{
  font-family:var(--font-display);font-size:13px;font-weight:700;color:var(--navy-900);
  margin:24px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line-2);
  display:flex;align-items:center;gap:8px;
}
.section-title::before{
  content:"";width:3px;height:14px;background:var(--gold-500);border-radius:2px;
}
.empty{text-align:center;padding:40px;color:var(--ink-500)}
.empty-ico{font-size:36px;margin-bottom:12px;opacity:.5}
/* responsive */
@media (max-width:1100px){
  .app{grid-template-columns:1fr}
  .sidebar{position:relative;height:auto;width:100%}
  .form-grid,.form-grid.cols-3,.form-grid.cols-4{grid-template-columns:1fr}
  .kpi-row,.kpi-row.kpi-row-3{grid-template-columns:repeat(2,1fr)}
  .bilingual{grid-template-columns:1fr}
}
/* print */
@media print{
  body{background:#fff}
  .sidebar,.topbar,.preview-toolbar,.wizard-steps,.tabs{display:none !important}
  .preview-body{padding:0;background:#fff;max-height:none}
  .doc{box-shadow:none;padding:0;max-width:none}
}

</style>

const CLAUSE_LIB = [
  /* ============ ENDOSOS MUNICH RE LATAM ============ */
  { id:'mr001', code:'Endoso 001', cat:'Endosos Munich Re LATAM', title_es:'Huelga, Motín y Conmoción Civil (SRCC)', title_en:'Strike, Riot & Civil Commotion',
    text_es:'No obstante las disposiciones de la Exclusión de la Sección I, queda entendido y convenido que esta póliza se extiende a cubrir pérdida o daño a los bienes asegurados causados directamente por huelguistas, obreros en lock-out, personas que tomen parte en disturbios laborales o conmociones civiles, o las acciones de cualquier autoridad legalmente constituida para suprimir o intentar suprimir tales disturbios. Sub-límite: USD {{srcc_limit}} por evento y agregado anual.',
    text_en:'Notwithstanding the exclusions of Section I, it is understood and agreed that this policy is extended to cover loss or damage to the insured property caused directly by strikers, locked-out workers, persons taking part in labour disturbances or civil commotions, or the actions of any legally constituted authority in suppressing or attempting to suppress such disturbances. Sub-limit: USD {{srcc_limit}} per event and annual aggregate.' },
  { id:'mr002', code:'Endoso 002', cat:'Endosos Munich Re LATAM', title_es:'Responsabilidad Civil Cruzada', title_en:'Cross Liability',
    text_es:'En cuanto a la Sección II (Responsabilidad Civil), esta póliza se aplicará a cada uno de los asegurados nombrados por separado, como si se hubiese emitido una póliza individual para cada uno. No obstante, el límite total de indemnización del Asegurador no excederá el límite indicado en la Carátula.',
    text_en:'In respect of Section II (Third Party Liability), this policy shall apply to each of the named insureds separately, as though a separate policy had been issued to each. Nevertheless, the total liability of the Insurer shall not exceed the limit stated in the Schedule.' },
  { id:'mr003', code:'Endoso 003', cat:'Endosos Munich Re LATAM', title_es:'Obras Aseguradas Recibidas y/o Puestas en Operación', title_en:'Insured Works Taken Over or Put into Operation',
    text_es:'Queda entendido y convenido que, sin perjuicio de la exclusión general aplicable a las obras o partes de las obras aseguradas que hayan sido entregadas, recibidas, aceptadas o puestas en operación por el Asegurado o por el principal antes de la finalización de la totalidad del proyecto, esta póliza se extiende a cubrir pérdida o daño a tales obras o partes de obras durante el resto del Período de Construcción. Sub-límite: {{end003_limit}}.',
    text_en:'It is understood and agreed that, notwithstanding the general exclusion applicable to insured works or parts thereof that have been handed over, taken over, accepted or put into operation by the Insured or the principal prior to completion of the entire project, this policy is extended to cover loss or damage to such works or parts during the remainder of the Construction Period. Sub-limit: {{end003_limit}}.' },
  { id:'mr004', code:'Endoso 004', cat:'Endosos Munich Re LATAM', title_es:'Mantenimiento Ampliado', title_en:'Extended Maintenance',
    text_es:'Queda entendido y convenido que el Asegurador, durante el Período de Mantenimiento ampliado, indemnizará al Asegurado por pérdida o daño a las obras contratadas (a) ocasionados por los contratistas en el curso de las operaciones que realicen para cumplir con sus obligaciones de mantenimiento bajo el contrato, y (b) ocurridos durante el período de mantenimiento siempre y cuando tales daños sean causados durante el período de construcción en el sitio. Duración ampliada: {{ext_maint_months}} meses adicionales.',
    text_en:'It is understood and agreed that the Insurer shall, during the extended Maintenance Period, indemnify the Insured against loss or damage to the contract works (a) caused by the contractors in the course of operations carried out to fulfil their maintenance obligations under the contract, and (b) occurring during the maintenance period provided such damage was caused during the construction period at the site. Extended duration: {{ext_maint_months}} additional months.' },
  { id:'mr006', code:'Endoso 006', cat:'Endosos Munich Re LATAM', title_es:'Gastos Extras, Flete Aéreo, Horas Extra, Trabajo Nocturno y Días Feriados', title_en:'Extra Charges — Air Freight, Overtime, Night Work and Holidays',
    text_es:'Esta póliza se extiende a cubrir gastos adicionales por horas extras, trabajo nocturno, trabajo en días feriados y flete aéreo en relación con cualquier siniestro indemnizable. Sub-límite: {{end006_limit}} ({{end006_pct}}% del siniestro, máximo absoluto).',
    text_en:'This policy is extended to cover additional expenses for overtime, night work, work on public holidays and air freight in connection with any loss recoverable. Sub-limit: {{end006_limit}} ({{end006_pct}}% of loss, absolute maximum).' },
  { id:'mr008', code:'Endoso 008', cat:'Endosos Munich Re LATAM', title_es:'Obras situadas en Zonas Sísmicas', title_en:'Works Located in Seismic Zones',
    text_es:'Queda garantizado que el Asegurado, en relación con la obra civil incluida en este seguro, observará y cumplirá con todos los requerimientos del código sísmico aplicable y las especificaciones técnicas establecidas para el diseño estructural antisísmico. Para Rep. Dominicana: cumplimiento del R-001 (MOPC) sobre Reglamento Sísmico.',
    text_en:'It is warranted that the Insured, in respect of the civil works included under this insurance, shall observe and comply with all requirements of the applicable seismic code and technical specifications for earthquake-resistant structural design. For Dominican Republic: compliance with R-001 (MOPC) seismic regulation.' },
  { id:'mr010', code:'Endoso 010', cat:'Endosos Munich Re LATAM', title_es:'Limpieza de Escombros tras Eventos Naturales', title_en:'Debris Removal after Natural Events',
    text_es:'Esta póliza se extiende a cubrir gastos extraordinarios por remoción de escombros adicionales tras eventos catastróficos naturales (terremoto, huracán, inundación). Sub-límite específico: {{end010_limit}}.',
    text_en:'This policy is extended to cover extraordinary debris removal expenses after natural catastrophic events (earthquake, hurricane, flood). Specific sub-limit: {{end010_limit}}.' },
  { id:'mr013', code:'Endoso 013', cat:'Endosos Munich Re LATAM', title_es:'Bienes Almacenados Fuera de Sitio (en Rep. Dominicana)', title_en:'Off-Site Storage (within Dominican Republic)',
    text_es:'Esta póliza se extiende a cubrir pérdida o daño a bienes asegurados mientras se encuentren almacenados fuera del sitio del proyecto en bodegas designadas dentro del territorio dominicano. Sub-límite en el agregado: {{end013_limit}}.',
    text_en:'This policy is extended to cover loss or damage to insured property whilst stored off-site at designated warehouses within Dominican territory. Aggregate sub-limit: {{end013_limit}}.' },
  { id:'mr102', code:'Endoso 102', cat:'Endosos Munich Re LATAM', title_es:'Condiciones Especiales relativas a Cables Subterráneos, Tuberías y demás Instalaciones', title_en:'Special Conditions for Underground Cables, Pipes and Installations',
    text_es:'En caso de pérdida o daño a cables, tuberías o instalaciones subterráneas, el Asegurador sólo indemnizará por los daños a tales cables o tuberías, siempre y cuando antes del inicio de los trabajos el Asegurado haya obtenido la información precisa sobre la ubicación de los mismos por parte de las autoridades competentes y haya tomado todas las medidas necesarias para evitar dichos daños. Sub-límite: {{end102_limit}}.',
    text_en:'In case of loss or damage to underground cables, pipes or installations, the Insurer shall indemnify only damage to such items provided that, prior to the commencement of the works, the Insured has obtained accurate information about their location from the relevant authorities and has taken all necessary measures to avoid such damage. Sub-limit: {{end102_limit}}.' },
  { id:'mr107', code:'Endoso 107', cat:'Endosos Munich Re LATAM', title_es:'Obligaciones relativas a Campamentos y Almacenes de Materiales de Construcción', title_en:'Site Camps and Construction Material Stores Warranty',
    text_es:'Queda garantizado que los campamentos del personal y los almacenes de materiales serán ubicados a una distancia segura de la obra principal, debidamente separados, con cerramientos adecuados, sistemas contra incendio, vigilancia y orden permanente. Sub-límite combinado: {{end107_limit}}.',
    text_en:'It is warranted that personnel camps and material stores shall be located at a safe distance from the main works, duly segregated, with adequate enclosures, fire protection, security and permanent order. Combined sub-limit: {{end107_limit}}.' },
  { id:'mr110', code:'Endoso 110', cat:'Endosos Munich Re LATAM', title_es:'Medidas de Seguridad en caso de Precipitaciones, Avenida e Inundación', title_en:'Safety Measures for Precipitation, Run-off and Flood',
    text_es:'Queda garantizado que las medidas adecuadas serán tomadas para proteger el sitio contra inundación previsible, considerando registros pluviométricos y eventos máximos probables de la región. Drenajes provisionales serán diseñados y mantenidos durante toda la obra. Andamios, encofrados y obras temporales debidamente arriostrados.',
    text_en:'It is warranted that adequate measures shall be taken to protect the site against foreseeable flood, considering rainfall records and probable maximum events of the region. Temporary drainage shall be designed and maintained throughout the works. Scaffolding, formwork and temporary works adequately braced.' },
  { id:'mr112', code:'Endoso 112', cat:'Endosos Munich Re LATAM', title_es:'Condiciones Especiales para Equipos Extintores de Incendio en Sitios de Obras', title_en:'Fire-Fighting Equipment on Construction Sites',
    text_es:'Queda garantizado que en el sitio de la obra se mantendrán extintores portátiles adecuados, hidrantes provisionales con suministro de agua suficiente, señalización clara y un plan de emergencia documentado. Los trabajos en caliente requerirán permiso previo escrito (Hot Work Permit). Sub-límite por protección de incendio en sitios de obra: {{end112_limit}}.',
    text_en:'It is warranted that adequate portable extinguishers, temporary hydrants with sufficient water supply, clear signage and a documented emergency plan shall be maintained on site. Hot works shall require a prior written Hot Work Permit. Fire protection on site sub-limit: {{end112_limit}}.' },
  { id:'mr113', code:'Endoso 113', cat:'Endosos Munich Re LATAM', title_es:'Transportes Nacionales (en Rep. Dominicana)', title_en:'Inland Transit (within Dominican Republic)',
    text_es:'Esta póliza se extiende a cubrir pérdida o daño a bienes asegurados durante el tránsito terrestre dentro del territorio dominicano, desde puerto/aduana o desde bodega del fabricante hasta el sitio del proyecto. Sub-límite por viaje: {{end113_limit}}.',
    text_en:'This policy is extended to cover loss or damage to insured property during inland transit within Dominican territory, from port/customs or from manufacturer\'s warehouse to the project site. Sub-limit per journey: {{end113_limit}}.' },
  { id:'mr115', code:'Endoso 115', cat:'Endosos Munich Re LATAM', title_es:'Riesgo del Diseñador (Error de Diseño)', title_en:"Designer's Risk (Faulty Design)",
    text_es:'No obstante lo establecido en las exclusiones de la Sección I, queda entendido y convenido que esta póliza se extiende a cubrir pérdida o daño a los bienes asegurados causados por error o defecto de diseño, cálculo o plano. El Asegurador no será responsable por el costo de reemplazar, reparar o rectificar el bien o la parte diseñada defectuosamente, ni por los gastos que se hubieran incurrido para corregir el error si se hubiese descubierto antes de la pérdida. Sub-límite por evento y en el agregado: {{end115_limit}} (mínimo 30% de la Suma Asegurada de la Sección I).',
    text_en:"Notwithstanding the exclusions of Section I, it is understood and agreed that this policy is extended to cover loss or damage to the insured property caused by error or defect in design, calculation or plan. The Insurer shall not be liable for the cost of replacing, repairing or rectifying the defectively designed item or part, nor for the costs that would have been incurred to correct the error had it been discovered prior to the loss. Sub-limit any one event and in the aggregate: {{end115_limit}} (minimum 30% of the Section I Sum Insured)." },
  { id:'mr119', code:'Endoso 119', cat:'Endosos Munich Re LATAM', title_es:'Bienes Existentes', title_en:'Existing Property',
    text_es:'Esta póliza se extiende a cubrir daños a bienes existentes preexistentes en el sitio o adyacentes al mismo, propiedad del Asegurado o bajo su custodia, causados directamente por la ejecución de las obras aseguradas. Sub-límite: {{end119_limit}}. Excluye desgaste, deterioro pre-existente y mantenimiento.',
    text_en:'This policy is extended to cover damage to pre-existing property on or adjacent to the site, owned by or in the custody of the Insured, caused directly by the execution of the insured works. Sub-limit: {{end119_limit}}. Excludes wear and tear, pre-existing deterioration and maintenance.' },
  { id:'mr-rc-vib', code:'Sub-Lim RC', cat:'Endosos Munich Re LATAM', title_es:'RC por Vibración, Remoción o Debilitamiento de Soportes', title_en:'TPL — Vibration, Removal or Weakening of Support',
    text_es:'Sub-límite específico bajo Sección II por daños a personas o bienes derivados de vibración, remoción o debilitamiento de soportes o bases. Aplica deducible especial. Sub-límite: {{vib_limit}}.',
    text_en:'Specific sub-limit under Section II for injury or property damage arising from vibration, removal or weakening of support or foundations. Special deductible applies. Sub-limit: {{vib_limit}}.' },
  /* ============ EXCLUSIONES NMA / LMA / CL ============ */
  { id:'nma2560', code:'NMA 2560', cat:'Exclusiones NMA / LMA / CL (Londres)', title_es:'Exclusión de Filtración, Polución y Contaminación', title_en:'Seepage, Pollution and Contamination Exclusion',
    text_es:'Este seguro no cubre pérdida, daño, responsabilidad ni gasto causado por o resultante de filtración, polución o contaminación de cualquier naturaleza, excepto cuando sea súbita e identificable durante el período del seguro.',

  { id:'nma2737', code:'NMA 2737', cat:'Exclusiones NMA / LMA / CL (Londres)', title_es:'Cláusula de Cooperación de Reclamos', title_en:'Claims Cooperation Clause',
    text_es:'El Asegurado se obliga a cooperar plenamente con los Aseguradores y Reaseguradores en la gestión, investigación y defensa de cualquier reclamación o acción legal, suministrando toda información, documentos y testimonios requeridos.',

  { id:'nma2842', code:'NMA 2842', cat:'Exclusiones NMA / LMA / CL (Londres)', title_es:'Cláusula de Evento 72 Horas (Definición de Evento/Pérdida/Ocurrencia)', title_en:'72-Hour Clause — Event/Loss/Occurrence Definition',
    text_es:'Para los fines de esta póliza, todas las pérdidas o daños ocurridos dentro de un período continuo de 72 horas, originados por la misma causa (huracán, terremoto, etc.), se considerarán una sola y única ocurrencia, y será aplicable un solo deducible.',

  { id:'nma2919', code:'NMA 2919', cat:'Exclusiones NMA / LMA / CL (Londres)', title_es:'Exclusión de Guerra y Actos de Terrorismo', title_en:'War and Terrorism Exclusion',
    text_es:'Este seguro excluye pérdida, daño, costo o gasto causado por, resultante de o en conexión con guerra, guerra civil, rebelión, revolución, insurrección o cualquier acto de terrorismo cometido por cualquier persona o personas actuando solas o en nombre o en conexión con cualquier organización.',
    text_en:'This insurance excludes loss, damage, cost or expense caused by, resulting from or in connection with war, civil war, rebellion, revolution, insurrection or any act of terrorism committed by any person or persons acting alone or on behalf of or in connection with any organisation.' },
  { id:'lma3100', code:'LMA 3100', cat:'Exclusiones NMA / LMA / CL (Londres)', title_es:'Cláusula de Exclusión y Limitante por Sanciones', title_en:'Sanctions Limitation and Exclusion Clause',
    text_es:'El (Re)asegurador no proveerá cobertura ni estará obligado a pagar siniestro o beneficio alguno cuando la provisión de dicha cobertura, pago o beneficio expusiera al (Re)asegurador a cualquier sanción, prohibición o restricción aplicable en las resoluciones de Naciones Unidas o sanciones comerciales o económicas, leyes o reglamentaciones de la Comunidad Europea, Reino Unido o Estados Unidos de América.',
    text_en:'The (Re)insurer shall not provide cover and shall not be liable to pay any claim or benefit hereunder to the extent that the provision of such cover, payment of such claim or benefit would expose the (Re)insurer to any sanction, prohibition or restriction under United Nations resolutions or trade or economic sanctions, laws or regulations of the European Community, United Kingdom or United States of America.' },
  { id:'lma5393', code:'LMA 5393', cat:'Exclusiones NMA / LMA / CL (Londres)', title_es:'Endoso de Enfermedades Transmisibles (Excluyendo Pandemias)', title_en:'Communicable Disease Endorsement (Excluding Pandemics)',
    text_es:'Esta póliza no asegura ninguna pérdida, daño, reclamo, costo, gasto u otra suma que surja directa o indirectamente de, atribuible a, o que ocurra simultáneamente o en cualquier secuencia con una Enfermedad Transmisible o el miedo o la amenaza (real o percibida) de una Enfermedad Transmisible. Aplica a todas las extensiones, coberturas adicionales y excepciones a exclusiones.',
    text_en:'This policy does not insure any loss, damage, claim, cost, expense or other sum directly or indirectly arising from, attributable to, or occurring concurrently or in any sequence with a Communicable Disease or the fear or threat (whether actual or perceived) of a Communicable Disease. Applies to all extensions, additional coverages and exceptions to exclusions.' },
  { id:'lma5394', code:'LMA 5394', cat:'Exclusiones NMA / LMA / CL (Londres)', title_es:'Exclusión de Enfermedades Contagiosas', title_en:'Contagious Disease Exclusion',
    text_es:'Sin perjuicio de cualquier disposición en contrario, este contrato excluye cualquier pérdida, daño, responsabilidad, reclamación, costo o gasto causado directa o indirectamente por o en conexión con una Enfermedad Transmisible o el temor o amenaza (real o percibida) de la misma, independientemente de cualquier otra causa o evento que contribuya simultáneamente o en cualquier otra secuencia.',
    text_en:'Notwithstanding any provision to the contrary, this contract excludes any loss, damage, liability, claim, cost or expense directly or indirectly caused by or in connection with a Communicable Disease or the fear or threat (whether actual or perceived) thereof, regardless of any other cause or event contributing concurrently or in any other sequence.' },

  if(!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00'); if(isNaN(d)) return '';
  const day = d.getDate();
  d.setMonth(d.getMonth() + (parseInt(m,10)||0));
  if(d.getDate() < day) d.setDate(0); /* ajusta fin de mes */
  const y=d.getFullYear(), mo=String(d.getMonth()+1).padStart(2,'0'), da=String(d.getDate()).padStart(2,'0');
  return y+'-'+mo+'-'+da;

/* Migración no-destructiva para casos existentes en localStorage */
function migrateCase(c){
  if(!c) return c;
  if(c.template === undefined) c.template = '';
  if(c.slipTarget === undefined) c.slipTarget = '';
  if(c.calcRate === undefined) c.calcRate = '';
  if(c.formato === undefined) c.formato = 'Muenchener';
  /* Nomenclatura correcta: TRC no renuevan, se extienden */
  if(c.status === 'Renovación') c.status = 'Extensión';
  /* Estado: "Emitido" se consolida con "Colocado" */
  if(c.status === 'Emitido') c.status = 'Colocado';
  /* Migración de nomenclatura CAR→TRC y EAR→TRM */
  if(c.header.type === 'CAR') c.header.type = 'TRC';
  if(c.header.type === 'EAR') c.header.type = 'TRM';
  if(c.header.type === 'CAR+EAR') c.header.type = 'TRC+TRM';
  if(!c.header.policyNo) c.header.policyNo = '';
  if(!c.header.startTime) c.header.startTime = '4:00 PM Hora Local';
  if(!c.header.policyStandard) c.header.policyStandard = 'De acuerdo a la Póliza Standard de Munich Re-Latinoamérica';
  if(c.period.testingDays !== undefined && !c.period.testingWeeks){
    c.period.testingWeeks = Math.round(c.period.testingDays/7) || 4;
    c.period.testingNote = c.period.testingWeeks + ' semanas para equipos nuevos';
  }
  /* Si hay fechas pero no duración en meses, calcularla; si no hay nada, default 12 */
  if(!c.period.constMonths){
    if(c.period.constStart && c.period.constEnd){
      const d1 = new Date(c.period.constStart);
      const d2 = new Date(c.period.constEnd);
      const months = (d2.getFullYear()-d1.getFullYear())*12 + (d2.getMonth()-d1.getMonth());
      c.period.constMonths = months > 0 ? months : 12;
    } else {
      c.period.constMonths = 12;
    }
  }
  if(!c.period.testingWeeks) c.period.testingWeeks = 4;
  if(!c.period.testingNote) c.period.testingNote = (c.period.testingWeeks||4)+' semanas para equipos nuevos';
  if(!c.interest.workScope) c.interest.workScope = '';
  if(c.interest.progress === undefined) c.interest.progress = '';
  if(!c.coverages){
    c.coverages = {
      A:{ enabled:true, sum:c.sums?.works||'', note:'Cobertura básica' },
      B:{ enabled:true, sum:'', note:'Terremoto, temblor, maremoto y erupción volcánica' },
      C:{ enabled:true, sum:'', note:'Ciclón, huracán, tempestad, inundación' },
      D:{ enabled:true, sum:'', note:'Daños durante mantenimiento' },
      EF:{ enabled:true, sum_event:c.sums?.liability_event||'', sum_agg:c.sums?.liability_agg||'', note:'RC Extracontractual' },
      G:{ enabled:true, pct:10, max:c.sums?.debris||'', note:'Remoción de Escombros' },
    };
  }
  if(!c.endorsement_sublimits) c.endorsement_sublimits = {};
  if(c.additional_conditions === undefined) c.additional_conditions = '';
  if(!c.cession) c.cession = { beneficiary:'', amount:'' };
  if(!c.coinsurance) c.coinsurance = [];
  if(!c.placement) c.placement = { premiumNet:'', isc:'', total:'', notes:'' };
  /* Casos llenados en Modo Rápido: completar los campos del modo avanzado */
  if(c.sums && c.coverages){
    const _si = +(c.coverages.A && c.coverages.A.sum) || 0;
    const _oth = ['supplies','cpm','temp','debris','fees','extra'].reduce((a,k)=>a+(+c.sums[k]||0),0);
    if(_si > 0 && !(+c.sums.works) && _oth < _si) c.sums.works = _si - _oth;
    if(!(+c.sums.liability_event) && c.coverages.EF && +c.coverages.EF.sum_event) c.sums.liability_event = +c.coverages.EF.sum_event;
    if(!(+c.sums.liability_agg) && c.coverages.EF && +c.coverages.EF.sum_agg) c.sums.liability_agg = +c.coverages.EF.sum_agg;
  }
  /* Eliminar cláusulas obsoletas que ya no existen en la biblioteca */
  const validIds = new Set(CLAUSE_LIB.map(cl => cl.id));
  c.clauses = (c.clauses||[]).filter(x => validIds.has(x.id));
  /* Asegurar que existen las cláusulas nuevas para casos antiguos.
     Si la cláusula es parte del estándar Garrigo, se selecciona automáticamente
     para que aparezca en el wording sin que el usuario tenga que activarla. */
  const existingIds = new Set(c.clauses.map(x=>x.id));
  CLAUSE_LIB.forEach(cl => {
    if(!existingIds.has(cl.id)){
      const isStandard = (typeof GARRIGO_BASE_CLAUSES !== 'undefined') && GARRIGO_BASE_CLAUSES.includes(cl.id);
      c.clauses.push({ id:cl.id, selected:isStandard, text_es:cl.text_es, text_en:cl.text_en });
    }
  });
  /* Auto-activar End. 003 para casos que ya lo tenían deseleccionado por una
     migración anterior (cuando se agregó después de que el caso ya existía). */
  const mr003 = c.clauses.find(x => x.id === 'mr003');
  if(mr003 && !mr003.selected && !c._mr003Migrated){
    mr003.selected = true;
    c._mr003Migrated = true;  /* Flag para que solo se aplique una vez */
  }
  /* End. 115 Error de Diseño: nunca por debajo del 30% de la Sección I */
  if(c.endorsement_sublimits && c.coverages && c.coverages.A && +c.coverages.A.sum){
    const _m115 = Math.round(+c.coverages.A.sum * 0.30);
    if(!(+c.endorsement_sublimits.mr115) || +c.endorsement_sublimits.mr115 < _m115) c.endorsement_sublimits.mr115 = _m115;
    if(c._lastSIForEnd115 === undefined) c._lastSIForEnd115 = +c.coverages.A.sum;
  }
  /* End. 003 sub-límite = 100% del valor asegurado (Cobertura A) */
  if(c.endorsement_sublimits && !c.endorsement_sublimits.mr003 && c.coverages?.A?.sum){
    c.endorsement_sublimits.mr003 = +c.coverages.A.sum;
  }
  /* Asegurar que existen las aseguradoras nuevas en el panel y purgar las que ya no operan */
  const validInsurers = new Set(DEFAULT_INSURERS.map(i => i.id));
  if(c.panel){
    c.panel = c.panel.filter(p => validInsurers.has(p.insurerId));
    const existingInsurers = new Set(c.panel.map(p => p.insurerId));
    DEFAULT_INSURERS.forEach(ins => {
      if(!existingInsurers.has(ins.id)){
        c.panel.push({ insurerId:ins.id, selected:false, contact:'', email:ins.email, phone:ins.phone, sent:false });
      }
    });
  }
  /* Purgar cotizaciones de aseguradoras eliminadas */
  if(c.quotes){
    c.quotes = c.quotes.filter(q => validInsurers.has(q.insurerId));
  }
  return c;
}

  state.cases.unshift(c);
  state.activeCaseId = c.id;
  state.view = 'risk';
  save(); render();
}

function render(){

  const c = activeCase();

  if(c){ chip.textContent = `${c.ref} · ${c.insured.name || 'Sin asegurado'}`; }
  else { chip.textContent = 'Sin caso seleccionado'; }

    dashboard:['Dashboard','Resumen de casos activos'],

    clauses:['Cláusulas y Condiciones','Selección y edición de cláusulas Munich Re / LMA / RD'],

function caseToCarteraRec(c){
  const it=c.interest||{};
  const loc=(it.location||'').trim(), desc=(it.description||'').trim(), coords=(it.coords||'').trim();
  let lat=null,lng=null,prov=loc||'—',geoc='sin_ubicar';
  const m=coords.match(/(-?\d+(?:\.\d+)?)\s*°?\s*([NnSs])?[,; ]+\s*(-?\d+(?:\.\d+)?)\s*°?\s*([EeWwOo])?/);
  if(m){ lat=parseFloat(m[1]); lng=parseFloat(m[3]); if(/[Ss]/.test(m[2]||''))lat=-Math.abs(lat); if(/[WwOo]/.test(m[4]||''))lng=-Math.abs(lng); geoc='exacto'; prov=loc||'coordenadas'; }
  if(lat==null||isNaN(lat)){ const g=geocodeRD(loc+' '+desc); lat=g[0]; lng=g[1]; prov=g[2]; geoc=(g[2]==='Sin ubicar')?'sin_ubicar':'aprox'; }
  const sel=(c.panel||[]).find(p=>p.selected)||(c.panel||[])[0];
  const ins=(typeof DEFAULT_INSURERS!=='undefined')?DEFAULT_INSURERS.find(i=>i.id===(sel&&sel.insurerId)):null;
  const q=(c.quotes||[]).find(x=>+x.premiumNet>0)||null;
  const primaNeta=q?(+q.premiumNet||0):0;
  return { cliente:(c.insured&&c.insured.name)||c.ref||'Caso', bien:(desc||loc||'—').slice(0,140), poliza:c.ref||'—',
    aseguradora: ins?ins.name:(c.status==='Colocado'?'Colocado (sin aseguradora)':'En gestión'),
    moneda:(c.header&&c.header.currency)||'DOP',
    vigStart:(c.period&&c.period.constStart)?fmtDate(c.period.constStart):'', vigEnd:(c.period&&c.period.constEnd)?fmtDate(c.period.constEnd):'',
    valor:siTotal(c), primaNetaAnual:primaNeta, lat:lat, lng:lng, provincia:prov, geo:geoc, source:'caso', status:c.status };
}
function carteraRecords(){
  const cs=(state.cases||[]).filter(c => (c.insured&&c.insured.name) || siTotal(c)>0 || (c.interest&&c.interest.location));
  return (Array.isArray(CARTERA_DB)?CARTERA_DB:TRC_CARTERA).concat(cs.map(caseToCarteraRec));
}
function _carEq(r){ return r.moneda==='USD' ? (r.valor||0)*CARTERA_FX : (r.valor||0); }
function _carPrimaEq(r){ return r.moneda==='USD' ? (r.primaNetaAnual||0)*CARTERA_FX : (r.primaNetaAnual||0); }
function _carRegion(r){
  const p=(r.provincia||'');
  if(/Altagracia|Punta Cana|Cap Cana/i.test(p)) return 'La Altagracia (Este)';
  if(/Santiago/i.test(p)) return 'Santiago';
  if(/Distrito Nacional/i.test(p)) return 'Distrito Nacional';
  if(/Santo Domingo/i.test(p)) return 'Gran Santo Domingo';
  return 'Por ubicar';
}
const _carRD = n => 'RD$ ' + Math.round(n||0).toLocaleString('en-US');

      const color = r.source==='caso' ? (r.status==='Colocado' ? '#16a34a' : '#FF5200') : (r.geo==='sin_ubicar' ? '#FF5200' : '#004A88');

        '<table style="font-size:12px;border-collapse:collapse">'+
        '<tr><td style="color:#888;padding:1px 6px 1px 0">Aseguradora</td><td><b>'+r.aseguradora+'</b></td></tr>'+

        '<tr><td style="color:#888;padding:1px 6px 1px 0">Prima neta</td><td>'+sym+' '+Math.round(r.primaNetaAnual||0).toLocaleString('en-US')+'</td></tr>'+

      );
      bounds.push([lat,lng]);

  });
  if(bounds.length) _carteraMap.fitBounds(bounds, { padding:[35,35], maxZoom:11 });
  setTimeout(() => { if(_carteraMap) _carteraMap.invalidateSize(); }, 120);

function canonInsurer(name){
  const u=(name||'').toUpperCase();
  if(u.includes('UNIVERSAL')) return 'Seguros Universal';
  if(u.includes('MAPFRE')) return 'Mapfre BHD Seguros';
  if(u.includes('COLONIAL')) return 'La Colonial';
  if(u.includes('BANRESERVAS')||u.includes('RESERVAS')) return 'Seguros Reservas';
  if(u.includes('SURA')) return 'Seguros Sura';
  if(u.includes('CRECER')) return 'Seguros Crecer';
  if(u.includes('HUMANO')) return 'Humano Seguros';
  return (name||'—').trim();
}
function carteraSection(){
  const R = carteraRecords();
  const nCasos = R.filter(r=>r.source==='caso').length;
  const nDOP = R.filter(r=>r.moneda==='DOP').length, nUSD = R.filter(r=>r.moneda==='USD').length;
  const sumDOP = R.filter(r=>r.moneda==='DOP').reduce((a,r)=>a+r.valor,0);
  const sumUSD = R.filter(r=>r.moneda==='USD').reduce((a,r)=>a+r.valor,0);
  const primaTot = R.reduce((a,r)=>a+_carPrimaEq(r),0);
  const groupBy = keyFn => { const g={}; R.forEach(r=>{ const k=keyFn(r); g[k]=g[k]||{n:0,val:0,prima:0}; g[k].n++; g[k].val+=_carEq(r); g[k].prima+=_carPrimaEq(r); }); return Object.entries(g).sort((a,b)=>b[1].val-a[1].val); };
  const byIns = groupBy(r=>canonInsurer(r.aseguradora));
  const byReg = groupBy(_carRegion);
  const maxIns = Math.max.apply(null, byIns.map(x=>x[1].val).concat([1]));
  const maxReg = Math.max.apply(null, byReg.map(x=>x[1].val).concat([1]));
  const bar = (v,mx,col) => `<div style="background:${col};height:7px;border-radius:4px;width:${Math.max(3, v/mx*100)}%"></div>`;

      <td style="min-width:120px">${bar(v.val,maxIns,'#004A88')}</td>
      <td class="num">${_carRD(v.prima)}</td>

  const regRows = byReg.map(([k,v]) => `<tr>
      <td style="font-weight:600">${k}</td>

      <td class="num" style="color:var(--num);font-weight:700">${_carRD(v.val)}</td>
      <td style="min-width:120px">${bar(v.val,maxReg,'#FF5200')}</td>
    </tr>`).join('');
  return `
    <div class="card">
      <div class="card-header"><div>
        <h2 class="card-title">Cartera TRC asegurada — mapa del país</h2>
        <div class="card-subtitle">${R.length} registros: ${R.length-nCasos} de cartera + ${nCasos} caso(s) del sistema · ${nDOP} RD$ / ${nUSD} US$</div>
      </div></div>
      <div id="carteraMap" style="height:430px;border-radius:12px;overflow:hidden;border:1px solid var(--line);z-index:0"></div>
      <div style="display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--ink-500);margin-top:8px">
        <span><span style="display:inline-block;width:11px;height:11px;border-radius:50%;background:#004A88;border:2px solid #fff;vertical-align:middle"></span> Cartera (Excel)</span>
        <span><span style="display:inline-block;width:11px;height:11px;border-radius:50%;background:#16a34a;border:2px solid #fff;vertical-align:middle"></span> Caso colocado</span>
        <span><span style="display:inline-block;width:11px;height:11px;border-radius:50%;background:#FF5200;border:2px solid #fff;vertical-align:middle"></span> Caso en gestión / por confirmar</span>
        <span>Clic en un punto para ver los datos.</span>
      </div>
    </div>

    <div class="kpi-row kpi-row-3">
      <div class="kpi"><div class="kpi-label">Pólizas TRC activas</div><div class="kpi-value">${R.length}</div><div class="kpi-sub">${nDOP} RD$ · ${nUSD} US$</div></div>
      <div class="kpi"><div class="kpi-label">Suma asegurada</div><div class="kpi-value" style="font-size:16px">RD$ ${Math.round(sumDOP).toLocaleString('en-US')}</div><div class="kpi-sub">+ US$ ${Math.round(sumUSD).toLocaleString('en-US')}</div></div>
      <div class="kpi"><div class="kpi-label">Prima neta anual</div><div class="kpi-value" style="font-size:17px">${_carRD(primaTot)}</div><div class="kpi-sub">RD$ equiv. (US$×${CARTERA_FX})</div></div>
    </div>

    <div class="card">
      <div class="card-header"><div><h2 class="card-title">Por aseguradora</h2><div class="card-subtitle">Suma asegurada y prima neta (RD$ equivalente)</div></div></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Aseguradora</th><th class="num">Pólizas</th><th class="num">Suma aseg.</th><th></th><th class="num">Prima neta</th></tr></thead>
        <tbody>${insRows}</tbody>
      </table></div>
    </div>

    <div class="card">
      <div class="card-header"><div><h2 class="card-title">Por región del país</h2><div class="card-subtitle">Concentración de la cartera TRC</div></div></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Región</th><th class="num">Pólizas</th><th class="num">Suma aseg.</th><th></th></tr></thead>
        <tbody>${regRows}</tbody>
      </table></div>
      <p class="muted" style="font-size:11px;margin-top:8px">Montos combinados en RD$ equivalente usan US$×${CARTERA_FX}. Ubicaciones aproximadas por proyecto; las marcadas "por confirmar" se pueden ajustar.</p>

function statusBadge(s){
  const map = { 'Cotizando':'badge-cot','Comparando':'badge-comp','Colocado':'badge-coloc','Extensión':'badge-ren' };

}
function openCase(id){
  state.activeCaseId = id;
  state.view = 'risk';
  save(); render();
}
function deleteCase(id){
  if(!confirm('¿Eliminar caso?')) return;
  state.cases = state.cases.filter(c => c.id !== id);
  if(sbClient && currentUser){ sbClient.from('cases').delete().eq('id', id).then(function(){}, function(){}); }
  if(state.activeCaseId === id) state.activeCaseId = state.cases[0]?.id || null;
  save(); render();
}
function duplicateCase(id){
  const orig = state.cases.find(c => c.id === id);
  if(!orig) return;
  const copy = JSON.parse(JSON.stringify(orig));
  copy.id = uid();
  copy.ref = (orig.ref || 'TRC') + '-COPIA';
  copy.status = 'Cotizando';
  copy.quotes = [];
  if(Array.isArray(copy.panel)) copy.panel.forEach(p => { p.sent = false; });
  copy.createdAt = new Date().toISOString();
  copy.updatedAt = new Date().toISOString();
  state.cases.unshift(copy);
  state.activeCaseId = copy.id;
  state.view = 'risk';
  save(); render();
}
function filterCases(){
  const qEl = document.getElementById('caseSearch'), sEl = document.getElementById('caseStatusFilter');
  const q = (qEl ? qEl.value : '').toLowerCase().trim();
  const st = sEl ? sEl.value : '';
  document.querySelectorAll('#casesBody tr[data-search]').forEach(tr => {
    const okQ = !q || (tr.getAttribute('data-search')||'').includes(q);
    const okS = !st || (tr.getAttribute('data-status')||'') === st;
    tr.style.display = (okQ && okS) ? '' : 'none';
  });
}
function insuredDirectory(){
  const seen = {}, out = [];
  (state.cases||[]).forEach(c => { const n=((c.insured&&c.insured.name)||'').trim(); if(n && !seen[n.toLowerCase()]){ seen[n.toLowerCase()]=1; out.push(c.insured); } });
  return out;
}
function autofillInsured(name){
  const c = activeCase(); if(!c) return;
  const key = (name||'').trim().toLowerCase();
  const match = insuredDirectory().find(i => ((i.name||'').trim().toLowerCase()) === key);
  if(!match) return;
  ['rnc','address','activity','contractor','principal','subs'].forEach(k => {
    if((!c.insured[k] || c.insured[k]==='') && match[k]) c.insured[k] = match[k];
  });
  save(); render();
}

async function uploadCaseDoc(k, input){
  const c = activeCase(); if(!c) return;
  const file = input.files[0]; if(!file) return;
  if(!sbClient || !currentUser){ syncToast('⚠ Inicia sesión para subir documentos', false); return; }
  const path = c.id + '/' + k + '_' + Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
  syncToast('Subiendo ' + file.name + '…', true);
  try{
    const up = await sbClient.storage.from('case-docs').upload(path, file, { upsert:false });
    if(up.error) throw up.error;
    c.docs = c.docs || [];
    const old = c.docs.find(d => d.tipo === k);
    if(old){ try{ await sbClient.storage.from('case-docs').remove([old.path]); }catch(e){} c.docs = c.docs.filter(d => d.tipo !== k); }
    c.docs.push({ tipo:k, name:file.name, path:path, size:file.size, uploadedAt:new Date().toISOString() });
    c.updatedAt = new Date().toISOString();
    save(); render();
    syncToast('Documento subido ✓', true);
  }catch(e){ console.error('upload doc', e); syncToast('⚠ No se pudo subir: '+_errTxt(e), false); }
}
async function openCaseDoc(k){
  const c = activeCase(); const d = docFor(c, k); if(!d || !sbClient) return;
  try{
    const r = await sbClient.storage.from('case-docs').createSignedUrl(d.path, 3600);
    if(r.error) throw r.error;
    window.open(r.data.signedUrl, '_blank');
  }catch(e){ console.error(e); syncToast('⚠ No se pudo abrir: '+_errTxt(e), false); }
}
async function removeCaseDoc(k){
  const c = activeCase(); const d = docFor(c, k); if(!d) return;
  if(!confirm('¿Eliminar este documento?')) return;
  try{ if(sbClient) await sbClient.storage.from('case-docs').remove([d.path]); }catch(e){ console.warn(e); }
  c.docs = c.docs.filter(x => x.tipo !== k); c.updatedAt = new Date().toISOString(); save(); render();
}
function uploadProjectImage(input){
  const c=activeCase(); if(!c) return;
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=function(e){
    const img=new Image();
    img.onload=function(){
      const maxW=1600, scale=Math.min(1, maxW/img.width);
      const w=Math.round(img.width*scale), h=Math.round(img.height*scale);
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      try{ c.projectImage = cv.toDataURL('image/jpeg', 0.82); }catch(err){ c.projectImage = e.target.result; }
      c.updatedAt=new Date().toISOString(); save();
      ensureProjectBanner(c).then(function(){ render(); });
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
function removeProjectImage(){ const c=activeCase(); if(!c) return; c.projectImage=''; delete BANNER_CACHE[c.id]; c.updatedAt=new Date().toISOString(); save(); render(); }
/* Foto del proyecto para el Quote Slip: recorte panorámico centrado (16:7),
   para que se vea igual en pantalla, PDF y Word. */
function makeProjectBanner(dataUrl){
  return new Promise(resolve => {
    if(!dataUrl) return resolve('');
    const img = new Image();
    img.onload = () => {
      try{
        const W = 1600, H = 700, r = W / H;
        let sw = img.width, sh = Math.round(img.width / r), sx = 0, sy = Math.round((img.height - sh) / 2);
        if(sh > img.height){ sh = img.height; sw = Math.round(img.height * r); sy = 0; sx = Math.round((img.width - sw) / 2); }
        const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
        cv.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, W, H);
        resolve(cv.toDataURL('image/jpeg', 0.85));
      }catch(e){ resolve(dataUrl); }
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}
const BANNER_CACHE = {};  /* id del caso -> { src, banner } (solo en memoria, no se guarda) */
function projectBannerSrc(c){ const b = BANNER_CACHE[c.id]; return (b && b.src === c.projectImage) ? b.banner : ''; }
async function ensureProjectBanner(c){
  if(!c || !c.projectImage || projectBannerSrc(c)) return;
  const banner = await makeProjectBanner(c.projectImage);
  BANNER_CACHE[c.id] = { src: c.projectImage, banner: banner };
}

function mapaObra(c, boxId){
  var it = (c && c.interest) ? c.interest : {};
  var loc = (it.location||'').trim();
  var coords = (it.coords||'').trim();
  if(!loc && !coords){
    return '<div id="'+boxId+'" class="field full"><label>Vista satelital del sitio</label>'
      + '<div style="padding:16px;border:1px dashed #cbd5e1;border-radius:10px;color:#94a3b8;font-size:12.5px">'
      + 'Escribe la ubicación o las coordenadas de la obra para ver la vista satelital y abrir Google Earth.</div></div>';
  }
  var lat=null,lng=null;
  var m = coords.match(/(-?\d+(?:\.\d+)?)\s*°?\s*([NnSs])?[,;\s]+\s*(-?\d+(?:\.\d+)?)\s*°?\s*([EeWwOo])?/);
  if(m){
    lat=parseFloat(m[1]); lng=parseFloat(m[3]);
    if(m[2] && /[Ss]/.test(m[2])) lat=-Math.abs(lat);
    if(m[4] && /[WwOo]/.test(m[4])) lng=-Math.abs(lng);
  }
  var hasLL = (lat!=null && !isNaN(lat) && lng!=null && !isNaN(lng));
  var q = hasLL ? (lat+','+lng) : (loc + ', República Dominicana');
  var enc = encodeURIComponent(q);
  var embed = 'https://maps.google.com/maps?q='+enc+'&t=k&z=18&hl=es&output=embed';
  var earth = hasLL ? ('https://earth.google.com/web/@'+lat+','+lng+',0a,600d,35y,0h,45t,0r') : ('https://earth.google.com/web/search/'+enc);
  var gmaps = 'https://www.google.com/maps/search/?api=1&query='+enc;
  var badge = hasLL ? (' · '+lat.toFixed(4)+', '+lng.toFixed(4)) : '';
  return '<div id="'+boxId+'" class="field full">'
    + '<label>Vista satelital del sitio'+badge+'</label>'
    + '<div style="border:1px solid #e2e8f0;border-radius:12px;overflow:hidden">'
    + '<iframe title="Vista satelital de la obra" src="'+embed+'" style="width:100%;height:300px;border:0;display:block" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>'
    + '<div style="display:flex;gap:8px;flex-wrap:wrap;padding:10px 12px;background:#f8fafc;border-top:1px solid #e2e8f0">'
    + '<a href="'+earth+'" target="_blank" rel="noopener" class="btn btn-ghost btn-sm" style="text-decoration:none">\U0001F30D Abrir en Google Earth</a>'
    + '<a href="'+gmaps+'" target="_blank" rel="noopener" class="btn btn-ghost btn-sm" style="text-decoration:none">\U0001F4CD Google Maps</a>'
    + '</div></div></div>';
}

/* Helper: cuando se cambia la SI de Sección I en Modo Rápido,
   propagar a coberturas B, C, D automáticamente (es lo más común) */
function syncCoverages(){
  const c = activeCase(); if(!c) return;
  const si = +c.coverages.A.sum || 0;
  if(si > 0){
    c.coverages.B.sum = si;
    c.coverages.C.sum = si;
    c.coverages.D.sum = si;
    if(!c.coverages.G.max) c.coverages.G.max = Math.round(si * 0.10);
    /* End. 003 Obras Recibidas siempre al 100% del SI */
    if(!c.endorsement_sublimits) c.endorsement_sublimits = {};
    c.endorsement_sublimits.mr003 = si;
    syncEnd115(c, c._lastSIForEnd115);
    c._lastSIForEnd115 = si;
    const others = _siOthers(c);
    if(others < si) c.sums.works = si - others;
  }
  c.updatedAt = new Date().toISOString();
  save();
}

/* ============================================================
   RNC → DGII: consulta automática del contribuyente (api/rnc.js)
   ============================================================ */
const DGII_UI = {};  /* estado temporal de la consulta (no se guarda) */
function rncFieldHtml(c){
  const ui = DGII_UI[c.id] || {};
  const d = c.insured.dgii;
  let st = '';
  if(ui.msg){
    st = '<div class="hint" style="margin-top:4px;color:'+(ui.err?'#dc2626':'var(--ink-500)')+'">'+escapeHtml(ui.msg)+'</div>';
  } else if(d && d.nombre){
    const ok = (d.estado||'').toUpperCase()==='ACTIVO';
    st = '<div class="hint" style="margin-top:4px;color:'+(ok?'#16a34a':'#dc2626')+'">'+(ok?'✓':'⚠')+' DGII: '+escapeHtml(d.estado||'—')+
         (d.regimen?' · Régimen '+escapeHtml(d.regimen):'')+(d.nombreComercial?' · '+escapeHtml(d.nombreComercial):'')+'</div>';
  }
  return '<div class="row" style="gap:6px"><input class="input" value="'+escapeHtml(c.insured.rnc||'')+'" placeholder="1-30-XXXXX-X" style="flex:1" '+
         'onchange="updPath(\'insured.rnc\',this.value);lookupRNC(this.value)" onkeydown="if(event.key===\'Enter\'){this.blur();}">'+
         '<button class="btn btn-ghost btn-sm" type="button" title="Buscar en la DGII" onclick="lookupRNC(activeCase()&&activeCase().insured.rnc)">🔍 DGII</button></div>'+st;
}
async function lookupRNC(v){
  const c = activeCase(); if(!c) return;
  const digits = String(v||'').replace(/\D/g,'');
  if(!digits) return;
  if(digits.length!==9 && digits.length!==11){ DGII_UI[c.id]={msg:'El RNC debe tener 9 dígitos (cédula: 11).', err:true}; render(); return; }
  if(typeof LOCAL_DEV!=='undefined' && LOCAL_DEV){ DGII_UI[c.id]={msg:'La consulta DGII funciona en la versión publicada (Vercel), no en modo local.', err:true}; render(); return; }
  DGII_UI[c.id]={msg:'Consultando DGII…', err:false}; render();
  try{
    const r = await fetch('/api/rnc?rnc='+digits);
    let j={}; try{ j = await r.json(); }catch(e){}
    if(!r.ok) throw new Error(j.error || ('HTTP '+r.status));
    const cc = state.cases.find(x=>x.id===c.id) || c;
    cc.insured.rnc = j.rnc || cc.insured.rnc;
    if(j.nombre) cc.insured.name = j.nombre;
    if(j.actividad) cc.insured.activity = j.actividad;
    cc.insured.dgii = j;
    delete DGII_UI[cc.id];
    cc.updatedAt = new Date().toISOString();
    save(); render();
    syncToast('DGII: '+(j.nombre||'datos cargados')+' ✓', true);
  }catch(e){
    DGII_UI[c.id] = { msg:'⚠ '+(e.message||e), err:true }; render();
  }
}
/* End. 115 Error de Diseño: sub-límite mínimo = 30% de la Sección I (Cobertura A) */
const END115_MIN_PCT = 0.30;
function end115Min(c){ return Math.round((+(c && c.coverages && c.coverages.A && c.coverages.A.sum) || 0) * END115_MIN_PCT); }
function end115Limit(c){ const v = +((c && c.endorsement_sublimits && c.endorsement_sublimits.mr115) || 0); return Math.max(v, end115Min(c)); }
/* Al cambiar la Sección I: si el sub-límite era el 30% anterior (o quedó por debajo), se ajusta al nuevo 30% */
function syncEnd115(c, oldA){
  if(!c) return;
  if(!c.endorsement_sublimits) c.endorsement_sublimits = {};
  const cur = +c.endorsement_sublimits.mr115 || 0, min = end115Min(c);
  const oldMin = Math.round((+oldA || 0) * END115_MIN_PCT);
  if(!cur || cur < min || cur === oldMin){
    c.endorsement_sublimits.mr115 = min;
    document.querySelectorAll('input[onchange^="updEnd115"]').forEach(el => { el.value = fmtMoneyInput(min); });
  }
}
function updEnd115(input){
  const c = activeCase(); if(!c) return;
  const n = parseMoneyInput(input.value), min = end115Min(c);
  const v = Math.max(n, min);
  updPath2('endorsement_sublimits','mr115', v);
  input.value = v > 0 ? v.toLocaleString('en-US') : '';
  if(n < min) syncToast('⚠ End. 115 Error de Diseño: mínimo 30% de la Sección I ('+min.toLocaleString('en-US')+')', false);
}
/* Rellena los {{campos}} de las cláusulas con los montos del caso */
function fillClauseTokens(text, c){
  if(!text || text.indexOf('{{') === -1) return text || '';
  const ccy = (c.header && c.header.currency) || 'DOP';
  const es = c.endorsement_sublimits || {};
  const money = v => (+v > 0) ? fmtMoney(+v, ccy) : '';
  const map = {
    srcc_limit: money(es.mr001), end003_limit: money(es.mr003 || (c.coverages && c.coverages.A && c.coverages.A.sum)),
    end006_limit: money(es.mr006), end010_limit: money(es.mr010), end013_limit: money(es.mr013),
    end102_limit: money(es.mr102), end107_limit: money(es.mr107), end112_limit: money(es.mr112),
    end113_limit: money(es.mr113), end115_limit: money(end115Limit(c)), end119_limit: money(es.mr119),
    vib_limit: money(es['mr-rc-vib']),
    ext_maint_months: (c.period && c.period.maintMonths) ? String(c.period.maintMonths) : '',
    cession_beneficiary: (c.cession && c.cession.beneficiary) || '', cession_amount: money(c.cession && c.cession.amount)
  };
  let out = text.replace(/USD\s*\{\{srcc_limit\}\}/g, '{{srcc_limit}}')
                .replace(/\s*\(\{\{end006_pct\}\}%[^)]*\)/g, '');
  return out.replace(/\{\{(\w+)\}\}/g, (m, k) => (map[k] ? map[k] : 'por definir / to be agreed'));
}

function coverageRows(c){

  const g = cv.G || {};
  return [
